<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="쯔꾸르 감성 픽셀 마을에서 30일 동안 판타지 주식을 사고파는 웹 게임">
<title>개미 퀘스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Orbit&display=swap">
<style>
/* Layout: one 4:3 pixel-map screen, RPG-Maker style windows layered over it, touch pad underneath */
:root{
  color-scheme:dark;
  --page:#0c0e1b; --page-ink:#9aa2cf;
  --win-a:#28388f; --win-b:#0e1646; --win-edge:#eef1ff; --win-shade:#04061a;
  --ink:#ffffff; --ink-dim:#b7c0ee; --gold:#ffd451;
  --up:#ff6a6a; --dn:#62b2ff; --flat:#cfd3ea;
  --sel:rgba(255,255,255,.15); --grid:rgba(255,255,255,.12);
  --f-ui:"DotGothic16","Orbit",ui-monospace,"Malgun Gothic",monospace;
}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--f-ui)}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:16px 24px;display:flex;flex-direction:column;gap:12px}
#game{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;container-type:inline-size;container-name:game;overflow:hidden;border-radius:4px;box-shadow:0 0 0 3px #000,0 0 0 5px #3a4380,0 12px 40px #0008;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#game > *{font-size:clamp(11px,2.05cqw,20px)}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--flat)} .gold{color:var(--gold)} .dim{color:var(--ink-dim)}

.win{position:absolute;box-sizing:border-box;background:linear-gradient(180deg,var(--win-a),var(--win-b));border:3px solid var(--win-edge);border-radius:7px;box-shadow:0 0 0 2px var(--win-shade),inset 0 0 0 2px rgba(0,0,0,.25);color:var(--ink);text-shadow:1px 1px 0 var(--win-shade);padding:.7em 1em;line-height:1.55}
.win button{font:inherit;color:inherit;text-shadow:inherit;background:none;border:0;cursor:pointer}
.win button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.win button:disabled{opacity:.4;cursor:default}

#hud{top:.5em;left:.5em;right:.5em;padding:.25em .8em;display:flex;flex-wrap:wrap;gap:.2em 1.1em;align-items:baseline;font-size:clamp(10px,1.65cqw,16px);opacity:.96}
#hud b{font-weight:normal;color:var(--gold)}
#hud .idx{margin-left:auto}
#hud i{font-style:normal}
.mk{display:inline-block;padding:0 .4em;border-radius:3px;border:1px solid currentColor;font-size:.85em;line-height:1.3}

#dlg{left:.6em;right:.6em;bottom:.6em;min-height:5.4em;z-index:30;cursor:pointer}
#dlgName{position:absolute;top:-2.15em;left:.3em;padding:.1em .8em;color:var(--gold)}
#dlgText{white-space:pre-line;min-height:3.1em}
#dlgMore{position:absolute;right:.8em;bottom:.3em;color:var(--gold);animation:bob .8s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#choice{right:.6em;bottom:7.6em;z-index:31;display:flex;flex-direction:column;padding:.4em;min-width:11em;max-width:calc(100% - 1.2em);max-height:calc(100% - 8.4em);overflow:auto}
#askBox{left:.6em;right:.6em;bottom:7.6em;z-index:32;display:flex;gap:.5em;padding:.5em;align-items:center}
#askBox input{flex:1;min-width:0;font:inherit;font-size:max(16px,1em);color:var(--ink);background:rgba(0,0,0,.35);border:2px solid var(--ink-dim);border-radius:4px;padding:.25em .5em}
#askBox button{border:2px solid rgba(255,255,255,.35)!important;border-radius:4px;padding:.15em .7em!important;flex:none}
.hudbtn{font:inherit;color:var(--gold);background:rgba(0,0,0,.25);border:1px solid var(--gold);border-radius:3px;padding:0 .5em;cursor:pointer}
.opt{text-align:left;padding:.12em .8em .12em 1.6em;border-radius:3px;position:relative;flex:none}
.opt.on{background:var(--sel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.opt.on::before{content:"▶";position:absolute;left:.4em;color:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

.big{inset:3.2em .6em .6em;z-index:20;display:flex;flex-direction:column;gap:.6em;overflow:auto;overscroll-behavior:contain}
.big > *{flex-shrink:0}
.big h2{margin:0;font-size:1.15em;font-weight:normal;color:var(--gold)}
.big h3{margin:0;font-size:1em;font-weight:normal;color:var(--ink-dim)}
.th{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4em 1em}
.th .sp{margin-left:auto}
.th b{font-weight:normal;color:var(--gold)}
.xbtn{border:2px solid var(--ink-dim)!important;border-radius:4px;padding:0 .6em!important}
.tbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:1em;min-height:0}
.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.1em}
.srow{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto 5.4em;gap:0 .5em;text-align:left;padding:.12em .5em .12em 1.4em!important;border-radius:3px;position:relative;align-items:baseline}
.srow .sn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sn i{font-style:normal;color:var(--gold);font-size:.75em;margin-left:.3em}
.srow .sp{text-align:right}
.srow .sc{text-align:right;font-size:.85em}
.srow.on{background:var(--sel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.srow.on::before{content:"▶";position:absolute;left:.35em;color:var(--gold)}
.srow.dead{opacity:.45;text-decoration:line-through}
.tdet{min-width:0;display:flex;flex-direction:column;gap:.4em}
.tname{display:flex;flex-wrap:wrap;gap:.2em .7em;align-items:baseline}
.tname small{color:var(--ink-dim);font-size:.82em}
.tname .xbtn{margin-left:auto;font-size:.8em}
.tprice{font-size:1.45em;line-height:1.2}
.tprice small{font-size:.6em;margin-left:.4em}
.chart{width:100%;height:auto;max-width:100%;background:rgba(0,0,0,.25);border-radius:4px;border:1px solid var(--grid)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.05em 1em;margin:0}
.kv div{display:flex;justify-content:space-between;gap:.5em;min-width:0}
.kv dt{color:var(--ink-dim);white-space:nowrap} .kv dd{margin:0;text-align:right}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.3em}
.btns button{border:2px solid rgba(255,255,255,.35);border-radius:4px;padding:.2em .2em;background:rgba(0,0,0,.18)}
.btns button.buy{border-color:color-mix(in srgb,var(--up) 70%,transparent)}
.btns button.sell{border-color:color-mix(in srgb,var(--dn) 70%,transparent)}
.btns button.short{border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.btns button.focus{background:var(--sel);box-shadow:0 0 0 2px var(--gold)}
.foot{margin:0;color:var(--ink-dim);font-size:.8em}
.badge{display:inline-block;padding:0 .4em;border-radius:3px;font-size:.8em;border:1px solid currentColor;margin-left:.2em}

.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-weight:normal;color:var(--ink-dim);text-align:right;padding:.12em .4em;border-bottom:1px solid var(--grid);white-space:nowrap}
.tbl td{text-align:right;padding:.12em .4em;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.scroll{overflow-x:auto}
.rowbtns{display:flex;flex-wrap:wrap;gap:.5em;justify-content:flex-end}
.rowbtns button{border:2px solid rgba(255,255,255,.35);border-radius:4px;padding:.1em .8em}
.rowbtns button.focus{background:var(--sel);box-shadow:0 0 0 2px var(--gold)}
.news{margin:0;padding-left:1.2em}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(12em,1fr));gap:.3em}
.ach{border:1px solid var(--grid);border-radius:4px;padding:.2em .5em;font-size:.85em;line-height:1.35;min-width:0}
.ach b{display:block;font-weight:normal}
.ach.on{border-color:var(--gold);background:rgba(255,212,81,.08)}
.ach.on b{color:var(--gold)}
.ach:not(.on){opacity:.5}

#report{z-index:45}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:40}
#toast{position:absolute;top:3.4em;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:.3em;align-items:center;pointer-events:none;width:max-content;max-width:90%}
#toast .win{position:relative;padding:.2em .9em;font-size:.9em;text-align:center}
#toast .win.news{border-color:var(--gold)}
#toast .win.ach{border-color:var(--gold);color:var(--gold)}

.screen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(8,10,30,.55),rgba(4,5,15,.9))}
.logo{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.55em;padding-inline:1em}
.logo h1{margin:0;font-size:3.6em;line-height:1;color:var(--gold);letter-spacing:.06em;text-shadow:3px 3px 0 #a0401c,6px 6px 0 #000}
.logo p{margin:0;color:var(--ink)}
.logo .sub{color:var(--ink-dim);font-size:.85em}
#titleMenu{position:relative;display:flex;flex-direction:column;padding:.5em;min-width:13em}
#endWin{position:relative;width:min(36em,92%);max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:.5em}
#endWin .rank{font-size:2em;color:var(--gold);line-height:1.2}

#pad{display:none;justify-content:space-between;align-items:center;gap:16px;padding-block:4px}
.dpad{--k:min(56px,14.5vw);display:grid;grid-template-columns:repeat(3,var(--k));grid-template-rows:repeat(3,var(--k));gap:4px}
.pbtn{font:inherit;color:var(--ink);background:linear-gradient(180deg,var(--win-a),var(--win-b));border:2px solid var(--win-edge);border-radius:8px;touch-action:none;-webkit-user-select:none;user-select:none;font-size:18px}
.pbtn:active,.pbtn.held{background:var(--win-a);filter:brightness(1.4)}
.dpad .u{grid-area:1/2} .dpad .l{grid-area:2/1} .dpad .r{grid-area:2/3} .dpad .d{grid-area:3/2}
.abtns{--k:min(64px,17vw);display:grid;grid-template-columns:repeat(2,var(--k));grid-template-rows:var(--k) 40px;gap:8px}
.abtns .a,.abtns .b{border-radius:50%}
.abtns .m{grid-column:1/3;font-size:14px}
.help{margin:0;color:var(--page-ink);font-size:13px;line-height:1.7;text-align:center}
.help kbd{font:inherit;border:1px solid #3a4380;border-radius:3px;padding:0 .35em;color:var(--ink)}
/* 폰 세로: 지도는 위, 대화창은 그 아래 빈 공간, 패드는 맨 아래 */
@media (max-width:720px),(pointer:coarse){
  html,body{height:100%;overscroll-behavior:none}
  body{overflow:hidden;-webkit-touch-callout:none}
  .wrap{height:100dvh;box-sizing:border-box;padding-block:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-bottom));gap:8px;max-width:min(100%,calc((100dvh - 210px)*4/3))}
  .help{display:none}
  .keys{display:none}
  #game{flex:1;min-height:0;aspect-ratio:auto;background:var(--page)}
  #cv{inset:auto;top:0;left:0;height:auto;aspect-ratio:4/3}
  #game > *{font-size:clamp(13px,3.4cqw,17px)}
  #hud{top:calc(75cqw + .4em)}
  #pad{display:flex}
}
/* 폰 가로: 지도를 화면 높이에 맞추고 패드는 양옆에 띄운다 */
@media (pointer:coarse) and (orientation:landscape) and (max-height:600px){
  .wrap{flex-direction:row;justify-content:center;align-items:center;padding:0;gap:0;max-width:none}
  #game{flex:none;width:min(calc(100dvh*4/3),calc(100vw - 380px));height:auto;aspect-ratio:4/3}
  #cv{inset:0;height:100%}
  #game > *{font-size:clamp(11px,2.6cqw,16px)}
  #hud{top:.5em}
  #pad{position:fixed;inset:0;pointer-events:none;align-items:flex-end;padding:12px max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  #pad > *{pointer-events:auto}
}
@container game (max-width:620px){
  .big{inset:0}
  .tbody{grid-template-columns:minmax(0,1fr)}
  #hud .idx{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="wrap">
  <div id="game">
    <canvas id="cv"></canvas>
    <div id="hud" class="win num" hidden></div>

    <div id="trade" class="win big" hidden>
      <div class="th"><h2>모험가 증권</h2><span id="tMarket"></span><span class="sp" id="tCash"></span><button class="xbtn" id="tClose">닫기</button></div>
      <div class="tbody">
        <ul id="tList" class="slist"></ul>
        <section class="tdet">
          <div class="tname"><span id="tName"></span><small id="tDesc"></small><button class="xbtn" id="tChartBtn"></button></div>
          <div class="tprice num"><span id="tPrice"></span><small id="tChg"></small></div>
          <canvas id="tChart" class="chart" width="560" height="190"></canvas>
          <dl class="kv num" id="tHold"></dl>
          <div class="btns" id="tBtns">
            <button class="buy" data-i="0">1주 사기</button>
            <button class="buy" data-i="1">10주 사기</button>
            <button class="buy" data-i="2">최대 사기</button>
            <button class="sell" data-i="3">1주 팔기</button>
            <button class="sell" data-i="4">10주 팔기</button>
            <button class="sell" data-i="5">모두 팔기</button>
          </div>
        </section>
      </div>
      <p class="foot" id="tFoot"></p>
    </div>

    <div id="status" class="win big" hidden></div>
    <div id="report" class="win big" hidden></div>

    <div id="dlg" class="win" hidden><div id="dlgName" class="win"></div><div id="dlgText"></div><span id="dlgMore">▼</span></div>
    <div id="choice" class="win" hidden></div>
    <div id="askBox" class="win" hidden><input id="askInput" autocomplete="off" enterkeyhint="done"><button id="askOk">확인</button><button id="askCancel">취소</button></div>

    <div id="fade"></div>
    <div id="toast"></div>

    <div id="title" class="screen" hidden>
      <div class="logo">
        <h1>개미 퀘스트</h1>
        <p>30일 안에 계좌를 불려라</p>
        <p class="sub">빨강은 상승, 파랑은 하락. 모험가 마을 증권가에 오신 걸 환영합니다.</p>
        <div id="titleMenu" class="win"></div>
        <p class="sub" id="titleBest"></p>
      </div>
    </div>
    <div id="end" class="screen" hidden><div id="endWin" class="win"></div></div>
  </div>

  <div id="pad">
    <div class="dpad">
      <button class="pbtn u" data-dir="up" aria-label="위">▲</button>
      <button class="pbtn l" data-dir="left" aria-label="왼쪽">◀</button>
      <button class="pbtn r" data-dir="right" aria-label="오른쪽">▶</button>
      <button class="pbtn d" data-dir="down" aria-label="아래">▼</button>
    </div>
    <div class="abtns">
      <button class="pbtn b" data-key="cancel">B</button>
      <button class="pbtn a" data-key="ok">A</button>
      <button class="pbtn m" data-key="menu">메뉴</button>
    </div>
  </div>
  <p class="help">이동 <kbd>←↑↓→</kbd>/<kbd>WASD</kbd> · 말 걸기·확인 <kbd>Space</kbd>/<kbd>Enter</kbd>/<kbd>Z</kbd> · 취소 <kbd>Esc</kbd>/<kbd>X</kbd> · 내 계좌 <kbd>M</kbd> · 지도를 클릭하면 그곳까지 걸어가고, 사람이나 문을 클릭하면 말을 겁니다<br>장은 09:00에 열려 15:30에 닫히고, 시세는 실시간으로 움직입니다. 집에서 자면 다음 날로 넘어갑니다. 진행 상황은 이 브라우저에 자동 저장됩니다.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
let rand=Math.random;
// 같은 시드면 누구에게나 같은 수열을 주는 난수 (오늘의 시장 · 멀티에서 시장을 똑같이 만든다)
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gauss=()=>{let u=0,v=0;while(!u)u=rand();while(!v)v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const pick=a=>a[Math.floor(rand()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const pct=x=>(x>0?'+':'')+(x*100).toFixed(2)+'%';
const cls=x=>x>1e-6?'up':x<-1e-6?'dn':'flat';
const arrow=x=>x>1e-6?'▲':x<-1e-6?'▼':'';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const css=getComputedStyle(document.documentElement);
const COL={up:css.getPropertyValue('--up').trim(),dn:css.getPropertyValue('--dn').trim(),gold:css.getPropertyValue('--gold').trim(),grid:css.getPropertyValue('--grid').trim(),dim:css.getPropertyValue('--ink-dim').trim()};
const FONT='DotGothic16, Orbit, "Malgun Gothic", sans-serif';

/* ================= 경제 데이터 ================= */
const DAYS=30,totalDays=()=>S&&S.multi?S.multi.days:DAYS,LOAN=1000000,SHORT_FEE=0.0005,DIV_TAX=0.154;
const DAY_START=510,OPEN=540,CLOSE=930,NIGHT_END=1320,STEP=10,N=(CLOSE-OPEN)/STEP;
const DF=()=>DIFF[S.diff];
const DIFF={
  easy:{name:'쉬움',start:3000000,goal:10000000,truth:.75,rate:.01,merchant:.4,fortune:.9,bear:0,upP:.55,pick:.05,loanMul:3,loanCap:50000000,
    fee:.00015,tax:.0018,lag:0,volMul:1,rent:0,delist:.08,fortuneCost:.01,
    forgive:.6,bkRate:0,
    desc:'시작 300만 원 · 목표 1,000만 원 · 소문이 잘 맞음'},
  normal:{name:'보통',start:1000000,goal:10000000,truth:.65,rate:.015,merchant:.2,fortune:.85,bear:0,upP:.5,pick:.08,loanMul:2,loanCap:30000000,
    fee:.00015,tax:.0018,lag:0,volMul:1,rent:0,delist:.08,fortuneCost:.01,
    forgive:.4,bkRate:0,
    desc:'시작 100만 원 · 목표 1,000만 원'},
  hard:{name:'어려움',start:1000000,goal:100000000,truth:.5,rate:.025,merchant:.05,fortune:.7,bear:-.005,upP:.4,pick:.15,loanMul:1,loanCap:10000000,
    fee:.0005,tax:.003,lag:2,volMul:1.25,rent:.02,delist:.15,fortuneCost:.03,
    forgive:.2,bkRate:.005,
    desc:'목표 1억 · 하락장 · 세력이 먼저 움직임 · 수수료↑ · 매주 집세'},
  hell:{name:'극악',start:1000000,goal:100000000,truth:.5,rate:0,merchant:0,fortune:.6,bear:-.008,upP:.35,pick:.25,loanMul:0,loanCap:0,
    fee:.0005,tax:.003,lag:4,volMul:1.5,rent:.03,delist:.2,fortuneCost:.05,
    forgive:0,bkRate:.01,strikes:1,living:20000,sharkRate:.1,sharkDays:5,noLarge:true,rotDay:3,swan:true,revert:.6,squeeze:.3,
    desc:'목표 1억 · 폭락장 · 은행 대출 없음 · 속보 뒤 되돌림 · 블랙스완 · 매일 생활비'}

// i0 이후 구간만 새로 만든다 (모래시계가 미래를 다시 굴릴 때 i0>0)
function makePath(st,rNoise,jumps,i0=0,old=null){
  const p0=old?old[i0]:st.price,I=INFO[st.id],n=N-i0,W=[0];
  for(let k=1;k<=n;k++)W[k]=W[k-1]+gauss();
  const lb=Math.log(1+rNoise),sig=I.vol*.7*2/Math.sqrt(N);
  const path=old?old.slice(0,i0):[];
  for(let k=0;k<=n;k++){
    const i=i0+k;
    let L=lb*k/n+sig*(W[k]-W[n]*k/n);
    for(const j of jumps)if(j.step>i0&&i>=j.step)L+=j.log*Math.min(1,(i-j.step+1)/(j.ramp||2));
    path.push(Math.min(st.hi,Math.max(st.lo,roundTick(p0*Math.exp(L)))));
  }
  path[i0]=p0;
  return path;
}
const MODE_W=[['stable',.3],['slowUp',.22],['slowDown',.22],['fastUp',.08],['fastDown',.08],['chaos',.1]];

  const w=MODE_W.map(([m,x])=>[m,x*(ratio>2.5&&m.endsWith('Up')?.3:ratio<.4&&m.endsWith('Down')?.3:1)]);
  let t=rand()*w.reduce((a,b)=>a+b[1],0);
  for(const [m,x] of w){if((t-=x)<=0)return m}
  return 'stable';
}
const noiseOf=(st,mood,frac=1)=>{const I=INFO[st.id],M=MODES[st.mode||'stable'];return (I.drift+M.d+mood*I.beta)*frac+gauss()*I.vol*M.v*DF().volMul*Math.sqrt(frac)};
function rerollFuture(i0){
  const mood=gauss()*.008;
  for(const st of S.stocks){
    if(st.dead)continue;
    S.path[st.id]=makePath(st,noiseOf(st,mood,(N-i0)/N),S.jumps[st.id]||[],i0,S.path[st.id]);
    S.next[st.id]=S.path[st.id][N]/st.prev-1;
  }
  for(const r of S.rumors)r.truth=r.id?(r.up===(S.next[r.id]>0)):!r.fake;

    else if(pat==='small'&&i<k+5)arr.push([r(.9,1.4),r(.9,1.4),r(1.4,1.9),r(1.4,2),r(1.4,1.9)][i-k]);
    else arr.push(pat==='large'?r(.4,.9):(v-=r(.03,.05),v));
  }
  S.tw={base,start:S.day,prices:arr.map(x=>Math.max(10,Math.round(base*x/10)*10))};
}
function turnipPrice(){
  if(!S.tw)return null;
  const d=S.day-S.tw.start;
  if(d<1||d>6||(DF().rotDay&&d>=DF().rotDay))return null;
  return S.tw.prices[(d-1)*2+(S.time>=720?1:0)];
}
function rollDay(){
  if(S.seed!=null)rand=mulberry((S.seed^Math.imul(S.day,2654435761))>>>0);
  try{rollDayInner()}finally{rand=Math.random}
}
function rollDayInner(){
  const D=DIFF[S.diff],mood=gauss()*.012+DIFF[S.diff].bear;
  S.events=[];S.path={};S.next={};S.rumors=[];
  const live=S.stocks.filter(s=>!s.dead);
  const jumps={};live.forEach(s=>jumps[s.id]=[]);
  for(const st of S.stocks){st.prev=st.price;st.hi=floorTick(st.price*1.3);st.lo=ceilTick(st.price*.7)}
  const n=rand()<.3?3:rand()<.6?2:1;
  for(const st of shuffle([...live]).slice(0,n)){
    const up=rand()<D.upP,mag=(.06+rand()*.14)*(st.id==='GBC'?1.7:1)*D.volMul,step=2+Math.floor(rand()*(N-5));
    jumps[st.id].push({step,log:Math.log(1+(up?mag:-mag))});
    if(D.revert)jumps[st.id].push({step:step+(D.lag||0)+1,log:-Math.log(1+(up?mag:-mag))*D.revert,ramp:6});
    S.events.push({id:st.id,up,text:pick(EV[st.id][up?'up':'down']),step,fired:false});
  }
  if(D.squeeze&&S.seed==null){
    // 극악: 공매도 잡힌 종목이 갑자기 튀어 오른다
    for(const st of live)if(S.short[st.id]&&rand()<D.squeeze){
      const step=2+Math.floor(rand()*(N-8));
      jumps[st.id].push({step,log:Math.log(1.15+rand()*.15)});
      S.events.push({id:st.id,up:true,text:`${INFO[st.id].name} 숏스퀴즈! 공매도 세력 비명`,step,fired:false});
    }
  }
  if(D.swan&&S.day===S.swanDay){
    const step=3+Math.floor(rand()*20);
    for(const st of live)jumps[st.id].push({step,log:Math.log(1-(.15+rand()*.1))});
    S.events.push({id:null,macro:true,up:false,text:'[블랙스완] 왕국 금고 파산설 확산... 전 종목 투매',step,fired:false,swan:true});
  }
  let macro=null;
  if(rand()<.25){
    macro=pick(MACRO);const step=2+Math.floor(rand()*(N-5)),k=.8+rand()*.4;
    for(const st of live){const e=macro.eff[st.id]??macro.eff['*']??0;if(e)jumps[st.id].push({step,log:Math.log(1+e*k)})}
    S.events.push({id:null,macro:true,up:macro.up,text:macro.text,step,fired:false});
  }
  S.jumps=jumps;
  for(const st of S.stocks){
    if(st.dead){S.path[st.id]=Array(N+1).fill(0);S.next[st.id]=0;continue}
    if(!st.mode||rand()<.18)st.mode=nextMode(st);
    S.path[st.id]=makePath(st,noiseOf(st,mood),jumps[st.id]);
    S.next[st.id]=S.path[st.id][N]/st.price-1;
  }
  for(const e of S.events){
    if(e.macro){if(macro&&!e.swan&&rand()<.6)S.rumors.push({id:null,up:e.up,text:macro.rumor});continue}
    const truth=rand()<D.truth,up=truth?e.up:!e.up;
    S.rumors.push({id:e.id,up,text:truth?e.text:pick(EV[e.id][up?'up':'down'])});
  }
  if(rand()<.5&&live.length){const o=pick(live),up=rand()<.5;if(!S.rumors.some(r=>r.id===o.id))S.rumors.push({id:o.id,up,text:pick(EV[o.id][up?'up':'down'])})}
  if(!macro&&rand()<.15){const m=pick(MACRO);S.rumors.push({id:null,up:m.up,text:m.rumor,fake:true})}
  if(D.swan&&S.day===S.swanDay-1)S.rumors.push({id:null,up:false,text:'요즘 왕국 금고 쪽 분위기가 이상하다더라',swanHint:true});
  for(const r of S.rumors)r.truth=r.swanHint?true:r.id?(r.up===(S.next[r.id]>0)):!r.fake;
  shuffle(S.rumors);
  const w=rand();S.weather=w<.18?'rain':w<.24?'snow':'sun';
  S.merchant=rand()<DIFF[S.diff].merchant;
  S.flags={};S.time=DAY_START;
  if(wdOf(S.day)===0||(DF().rotDay&&wdOf(S.day)===DF().rotDay)){
    if(S.tn&&S.tn.qty){S.flags.rotten=S.tn.qty;S.tn=null;ach('rot')}
  }
  if(wdOf(S.day)===0){
    turnipWeek();
  }
  const sr=rand();
  S.street=sr<DIFF[S.diff].pick?{type:'pick',at:1090+rand()*200,done:false}:sr<DIFF[S.diff].pick+.08?{type:'wallet',at:560+rand()*360,done:false}:null;
  updatePrices();
}
function updatePrices(){
  const f=Math.max(0,Math.min(N,(S.time-OPEN)/STEP)),i=Math.floor(f),fr=f-i;
  for(const st of S.stocks){
    const p=S.path[st.id];if(!p||st.dead)continue;
    const v=i>=N?p[N]:p[i]+(p[i+1]-p[i])*fr;
    st.price=Math.min(st.hi,Math.max(st.lo,roundTick(v)));
  }
}

/* ----- 장 마감 & 다음 날 ----- */
function advanceDay(){
  S.time=CLOSE;updatePrices();
  const rep={day:S.day,rows:[],events:S.events.map(e=>({...e})),div:0,shortFee:0,dead:[],interest:0};
  for(const st of S.stocks){
    const chg=chgOf(st);
    st.limit=st.dead?null:st.price>=st.hi&&chg>.29?'up':st.price<=st.lo&&chg<-.29?'dn':null;
    if(st.limit==='up'&&S.pos[st.id])ach('limitup');
    if(st.limit==='dn'&&S.pos[st.id])ach('limitdn');
    rep.rows.push({id:st.id,price:st.price,chg,limit:st.limit,dead:st.dead});
  }
  for(const st of S.stocks){
    if(!st.dead&&st.price<INFO[st.id].p*DF().delist){
      st.dead=true;rep.dead.push(st.id);
      if(S.pos[st.id]){delete S.pos[st.id];ach('delist')}
      if(S.short[st.id]){S.stats.realized+=S.short[st.id].avg*S.short[st.id].qty;delete S.short[st.id]}
      st.price=0;
    }
    st.hist.push(st.price);
  }
  if(S.day%10===0){
    for(const id in DIV){
      const st=stockOf(id);if(st.dead)continue;
      const L=S.pos[id]?.qty||0,Sh=S.short[id]?.qty||0;
      rep.div+=Math.round(L*st.price*DIV[id]*(1-DIV_TAX))-Math.round(Sh*st.price*DIV[id]);
    }
    if(rep.div){S.cash+=rep.div;S.stats.divs+=rep.div;if(rep.div>0)ach('div')}
  }
  rep.shortFee=Math.round(shortValue()*SHORT_FEE);S.cash-=rep.shortFee;
  rep.interest=Math.round(S.debt*DIFF[S.diff].rate);S.debt+=rep.interest;
  if(S.shark){
    const si=Math.round(S.shark.amt*sharkRate());S.shark.amt+=si;rep.interest+=si;
    if(S.day>=S.shark.due){
      // 기한 초과: 상어 형님이 계좌를 통째로 정리한다
      for(const id in S.pos){const st=stockOf(id),g=S.pos[id].qty*st.price;S.cash+=g-Math.ceil(g*DF().fee)-Math.floor(g*DF().tax)}
      for(const id in S.short){const st=stockOf(id),c=S.short[id].qty*st.price;S.cash-=c+Math.ceil(c*DF().fee)}
      S.pos={};S.short={};
      rep.collect=S.shark.amt;S.cash-=S.shark.amt;S.shark=null;
    }
  }
  S.lastEvents=rep.events;
  S.idxHist.push(indexNow());
  const eq=equity();S.eqHist.push(eq);S.stats.peak=Math.max(S.stats.peak,eq);
  if(DF().swan&&S.day===S.swanDay&&eq>S.eqHist[S.eqHist.length-2])ach('swan');
  S.day++;
  if(wdOf(S.day)===0&&DF().rent){rep.rent=Math.max(50000,Math.round(Math.max(0,equity())*DF().rent/1000)*1000);S.cash-=rep.rent}
  if(DF().living){rep.living=DF().living;S.cash-=rep.living}
  if(inBk()){
    // 회생: 매일 밤 변제금이 자동으로 빠져나가고, 못 내면 경고가 쌓인다
    const b=S.bk,bi=Math.round(b.debt*DF().bkRate);b.debt+=bi;
    const need=Math.min(b.daily,b.debt),pay=Math.min(Math.max(0,S.cash),need);
    S.cash-=pay;b.debt-=pay;rep.bkPay=pay;rep.bkInterest=bi;
    if(pay<need){b.strikes++;rep.bkStrike=b.strikes}
    if(b.debt<=0){b.debt=0;b.done=true;rep.bkDone=true;ach('reborn')}
  }
  if(S.cash<0){
    // 현금이 마이너스면 빚으로 넘긴다 (회생 중이면 회생 빚에 더해진다)
    const neg=-S.cash;S.cash=0;rep.autoLoan=neg;
    if(inBk())S.bk.debt+=neg;else S.debt+=neg;
  }
  rollDay();
  return rep;
}

/* ----- 주문 ----- */
function canTrade(st){
  if(!marketOpen()){buzz();toast(S.time<OPEN?'아직 장이 열리지 않았습니다 (09:00 개장)':'오늘 장은 마감됐습니다 (내일 09:00 개장)');return false}
  if(st.dead){buzz();toast('상장폐지된 종목입니다');return false}
  return true;
}
function buy(id,q){
  const st=stockOf(id);if(!canTrade(st))return;
  q=Math.min(q,Math.floor(S.cash/(st.price*(1+DF().fee))));
  if(q<=0){buzz();toast('현금이 부족합니다');return}
  const cost=q*st.price,fee=Math.ceil(cost*DF().fee);
  const p=S.pos[id]||(S.pos[id]={qty:0,avg:0});
  p.avg=(p.avg*p.qty+cost)/(p.qty+q);p.qty+=q;
  S.cash-=cost+fee;S.stats.trades++;S.stats.fees+=fee;
  ach('first');if(cost>=10000000)ach('allin');
  coin();toast(`${INFO[id].name} ${fmt(q)}주 매수 · ${fmt(cost+fee)}원`);
}
function sell(id,q){
  const st=stockOf(id),p=S.pos[id];if(!canTrade(st))return;
  q=Math.min(q,p?.qty||0);
  if(q<=0){buzz();toast('팔 주식이 없습니다');return}
  const gross=q*st.price,fee=Math.ceil(gross*DF().fee),tax=Math.floor(gross*DF().tax),r=st.price/p.avg-1;
  S.cash+=gross-fee-tax;S.stats.trades++;S.stats.fees+=fee+tax;
  S.stats.realized+=(st.price-p.avg)*q-fee-tax;
  if(id==='GBC'&&r>=.5)ach('moon');
  if(r<=-.2)ach('panic');
  if(gross>=10000000)ach('allin');
  p.qty-=q;if(!p.qty)delete S.pos[id];
  coin(true);toast(`${INFO[id].name} ${fmt(q)}주 매도 · ${fmt(gross-fee-tax)}원 (${pct(r)})`);
}
function shortSell(id,q){
  const st=stockOf(id);if(!canTrade(st))return;
  if(S.pos[id]){buzz();toast('보유 중인 종목은 공매도할 수 없습니다');return}
  if(inBk()){buzz();toast('회생 중에는 공매도할 수 없습니다');return}
  const room=Math.max(0,equity())-shortValue();
  q=Math.min(q,Math.floor(room/st.price));
  if(q<=0){buzz();toast('공매도 한도 초과 (총자산만큼만 가능)');return}
  const gross=q*st.price,fee=Math.ceil(gross*DF().fee),tax=Math.floor(gross*DF().tax);
  const s=S.short[id]||(S.short[id]={qty:0,avg:0});
  s.avg=(s.avg*s.qty+gross)/(s.qty+q);s.qty+=q;
  S.cash+=gross-fee-tax;S.stats.trades++;S.stats.fees+=fee+tax;
  coin(true);toast(`${INFO[id].name} ${fmt(q)}주 공매도 · ${fmt(gross)}원`);
}
function shortCover(id,want=Infinity){
  const st=stockOf(id),s=S.short[id];if(!canTrade(st))return;
  if(!s){buzz();toast('갚을 공매도 물량이 없습니다');return}
  const q=Math.min(want,s.qty,Math.floor(S.cash/(st.price*(1+DF().fee))));
  if(q<=0){buzz();toast('갚을 현금이 부족합니다');return}
  const cost=q*st.price,fee=Math.ceil(cost*DF().fee),pl=(s.avg-st.price)*q-fee;
  S.cash-=cost+fee;S.stats.trades++;S.stats.fees+=fee;S.stats.realized+=pl;
  if(pl>0)ach('shortwin');
  s.qty-=q;if(!s.qty)delete S.short[id];
  coin();toast(`${INFO[id].name} ${fmt(q)}주 공매도 상환 · 손익 ${fmt(pl)}원`);
}

function planRoute(tx,ty){
  route=null;

  if(!goals.size)return;

function drawChart(canvas,data,opt={}){
  const c=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
  c.clearRect(0,0,W,H);
  if(!data.length)return;
  const pl=12,pr=110,pt=18,pb=18,base=opt.base??data[0],fmtL=opt.fmt||fmt;
  let lo=Math.min(...data,base),hi=Math.max(...data,base);
  if(opt.avg){lo=Math.min(lo,opt.avg);hi=Math.max(hi,opt.avg)}
  if(hi===lo){hi=hi*1.02+1;lo=lo*.98}
  const sp=hi-lo;lo-=sp*.1;hi+=sp*.1;
  const total=Math.max(opt.slots||data.length,2)-1;
  const X=i=>pl+i*(W-pl-pr)/total;
  const Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  c.font=`20px ${FONT}`;c.textBaseline='middle';c.textAlign='left';
  for(let k=0;k<=3;k++){
    const v=lo+(hi-lo)*k/3,y=Y(v);
    c.strokeStyle=COL.grid;c.lineWidth=1;c.beginPath();c.moveTo(pl,y);c.lineTo(W-pr+6,y);c.stroke();
    c.fillStyle=COL.dim;c.fillText(fmtL(v),W-pr+12,y);
  }
  if(opt.base!=null){c.setLineDash([3,5]);c.strokeStyle=COL.dim;c.beginPath();c.moveTo(pl,Y(base));c.lineTo(W-pr+6,Y(base));c.stroke();c.setLineDash([])}
  const col=data[data.length-1]>=base?COL.up:COL.dn;
  c.beginPath();data.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)));
  c.lineTo(X(data.length-1),H-pb);c.lineTo(X(0),H-pb);c.closePath();
  c.globalAlpha=.18;c.fillStyle=col;c.fill();c.globalAlpha=1;
  c.beginPath();data.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)));
  c.strokeStyle=col;c.lineWidth=3;c.lineJoin='round';c.stroke();
  const lx=X(data.length-1),ly=Y(data[data.length-1]);
  c.fillStyle=col;c.fillRect(lx-5,ly-5,10,10);
  if(opt.avg){
    c.setLineDash([8,6]);c.strokeStyle=COL.gold;c.lineWidth=2;c.beginPath();c.moveTo(pl,Y(opt.avg));c.lineTo(W-pr+6,Y(opt.avg));c.stroke();c.setLineDash([]);
    c.fillStyle=COL.gold;c.fillText(opt.avgLabel||'평단',pl+4,Y(opt.avg)-14);
  }
  if(opt.label){c.fillStyle=COL.dim;c.textAlign='right';c.fillText(opt.label,W-pr-4,pt)}
}

      ${rep.collect?`<div><dt>상어 형님 강제 정리</dt><dd class="dn">-${fmt(rep.collect)}원</dd></div>`:''}</dl>

const NAMES=()=>S.stocks.map(s=>INFO[s.id].name+(s.dead?' (상폐)':''));
const BENCH={x:8,y:9,dir:'left'};
async function declareBankruptcy(){
  const Nm='법원 집행관';
  // 보유 주식은 종가에 팔고, 공매도는 종가에 갚는다
  for(const id in S.pos){const st=stockOf(id),g=S.pos[id].qty*st.price;S.cash+=g-Math.ceil(g*DF().fee)-Math.floor(g*DF().tax)}
  for(const id in S.short){const st=stockOf(id),c=S.short[id].qty*st.price;S.cash-=c+Math.ceil(c*DF().fee)}
  S.pos={};S.short={};
  if(S.tn){S.tn=null}
  const owed=Math.max(0,S.debt+(S.shark?.amt||0)-S.cash);
  S.debt=0;S.shark=null;
  const forgiven=Math.round(owed*DF().forgive/1000)*1000,debt=Math.max(10000,owed-forgiven);
  const left=Math.max(4,totalDays()-S.day+1);
  S.cash=50000;
  S.bk={debt,orig:debt,start:S.day,daily:Math.max(10000,Math.ceil(debt/left/1000)*1000),strikes:0,done:false};
  S.bkCount++;ach('bankrupt');
  placePlayer(BENCH);resetNPCs();updateHUD();save();
  buzz();
  await say('쾅쾅쾅! 이른 아침부터 누군가 문을 두드린다.');
  await say(`모험가 씨, 총자산이 0 아래로 떨어져 파산이 선고되었습니다.\n보유 주식은 모두 처분했고, 집은 압류되었습니다.`,Nm);
  await say(`갚아야 할 돈 ${fmt(owed)}원 중 ${fmt(forgiven)}원을 탕감하고,\n남은 ${fmt(debt)}원은 개인회생으로 갚게 됩니다.`,Nm);
  await say(`매일 밤 ${fmt(S.bk.daily)}원씩 자동으로 빠져나갑니다.\n${strikeMax()}번 못 내면 회생이 폐지됩니다. 회생 중엔 대출·사채·공매도·도박이 금지입니다.`,Nm);
  await say('생계비 5만 원은 남겨 드립니다. ...힘내세요.',Nm);
  await say('(눈을 뜨니 낚시터 벤치였다. 옆에서 박씨가 낚싯대를 드리우고 있다.)');
  await say('허허, 자네도 왔구먼. 여기 벤치 자리 하나는 내가 맡아 두지.\n일거리가 필요하면 말하게. 낚시든 뭐든 같이 하세.','물린 박씨');
  await say('회생 중 할 수 있는 일:\n· 박씨: 낚시 알바, 벤치에서 잠자기\n· 거래소: 청소 알바 · 미믹 상자: 정리 알바\n알바는 하루 3번까지, 할 때마다 시간이 흐른다.','도움말');
}
const jobsLeft=()=>3-(S.flags.jobs||0);
async function jobDone(pay,minutes,text){
  S.flags.jobs=(S.flags.jobs||0)+1;
  clockTo(S.time+minutes);
  if(pay>0){S.cash+=pay;coin()}
  updateHUD();
  await say(`${text}${pay>0?`\n${fmt(pay)}원을 벌었다.`:''} (오늘 남은 알바 ${jobsLeft()}번 · ${hhmm(S.time)})`);
}
async function fishingJob(){
  const Nm='물린 박씨';
  await say('찌가 "쑥" 들어갈 때 당기는 거야. 살짝 흔들릴 땐 참고.\n세 번 던져 보세.',Nm);
  let fish=0;
  for(let r=0;r<3;r++){
    const teases=Math.floor(rand()*3);let result=null;
    for(let k=0;k<=teases&&result===null;k++){
      const real=k===teases;
      const q=real?pick(['찌가 쑥! 하고 물속으로 빨려 들어갔다!','찌가 쑤욱 가라앉는다!']):pick(['찌가 살짝 흔들린다...','물결이 일렁인다...','찌가 톡 하고 움직였다...']);
      const c=await choose(`[${r+1}번째] ${q}`,['당긴다!','기다린다'],null,1);
      if(c===0)result=real?'got':'early';
      else if(real)result='late';
    }
    if(result==='got'){fish++;tone(988,.08);await say(pick(['붕어를 낚았다!','송사리를 낚았다!','월척 잉어를 낚았다!','은빛 슬라임 물고기를 낚았다!']))}
    else if(result==='early')await say('너무 일찍 당겼다! 물고기가 놀라 도망갔다.');
    else await say('...늦었다. 물고기가 미끼만 먹고 사라졌다.');
  }
  if(fish===3)ach('fish');
  await jobDone(fish*25000,60,fish?`물고기 ${fish}마리를 박씨에게 넘겼다. "자네 손맛이 좋구먼!"`:'한 마리도 못 낚았다. 박씨가 말없이 어깨를 두드린다.');
}
async function goSleep(){
  if(S.multi)return say('멀티에서는 잘 필요가 없어요.\n밤 10시가 지나면 모두에게 동시에 다음 날이 와요.');
  const last=S.day>=totalDays(),bed=inBk()?'낚시터 벤치. 딱딱하지만 누울 만하다.':'푹신한 침대가 있다.';
  const q=last?'마지막 밤이다. 자고 일어나면 최종 결산이 시작된다.\n잠을 잘까?':S.time<CLOSE?`아직 ${hhmm(S.time)}이다. 지금 자면 장 마감까지 건너뛴다.\n잠을 잘까?`:`${bed} 잠을 잘까?`;
  const c=await choose(q,['잔다','아직 안 잔다']);
  if(c!==0)return;
  sleeping=true;
  const prevEq=S.eqHist[S.eqHist.length-1];
  await fadeTo(1);jingle();
  const rep=advanceDay();
  placePlayer(inBk()?BENCH:{x:4,y:5,dir:'down'});resetNPCs();
  updateHUD();save();
  await wait(500);
  await showReport(prevEq,rep);
  sleeping=false;
  if(inBk()&&S.bk.strikes>=strikeMax())return ending('fail');
  if(S.day>totalDays())return ending(equity()<0&&!inBk()?'bankrupt':null);
  if(!inBk()&&equity()<0){
    if(S.bkCount>=1)return ending('bankrupt');
    await fadeTo(0);
    await declareBankruptcy();
    return;
  }
  await fadeTo(0);
  const wx={sun:'',rain:' 밖에는 비가 내린다.',snow:' 밖에 눈이 내린다!'}[S.weather];
  if(S.flags.rotten)await say(`가방에서 고약한 냄새가 난다... 황금무 ${fmt(S.flags.rotten)}개가 모두 썩어 버렸다.`);
  if(rep.bkDone)await say('법원에서 편지가 왔다.\n"회생 절차를 모두 마쳤습니다. 신용이 회복되었습니다."\n오늘부터 다시 집에서 잘 수 있다!');
  else if(inBk())await say(`(벤치에서 일어났다. 등이 배긴다...)\n남은 회생 빚 ${fmt(S.bk.debt)}원 · 하루 변제금 ${fmt(S.bk.daily)}원 · 경고 ${S.bk.strikes}/${strikeMax()}`);
  await say(`${S.day}일차(${WD[wdOf(S.day)]}요일) 아침이 밝았다.${wx}${wdOf(S.day)===0?'\n일요일이다. 정오까지 무 장수 무순이가 황금무를 판다.':''}${S.shark&&S.shark.due-S.day<=1?'\n오늘이 사채 상환 기한이다!':''}${S.merchant?'\n마을 아래쪽에 수상한 상인이 와 있다는 소문이다.':''}${S.day===totalDays()?'\n오늘이 마지막 거래일이다!':''}${S.day%10===0?'\n오늘 장 마감 때 배당금이 나온다.':''}`);
}
async function enter(b){
  if(b.id==='home'){
    if(inBk())return say('문에 빨간 압류 딱지가 붙어 있다.\n...오늘도 낚시터 벤치에서 자야겠다. (박씨에게 말을 걸자)');

      return jobDone(30000,60,'거래소 바닥에 떨어진 찢어진 매도 주문서들을 쓸어 담았다.');
    }

    return openTrade();
  }
  if(b.id==='bank'&&inBk())return say('회생 중인 분께는 대출을 해 드릴 수 없습니다.\n회생 빚부터 갚고 오세요.','은행원');
  if(b.id==='exch'){
    await say(marketOpen()?'어서 오세요! 모험가 증권입니다.\n오늘도 성투하세요.':`지금은 ${S.time<OPEN?'개장 전':'장 마감 후'}이라 시세 조회만 가능해요.\n장 시간은 09:00~15:30입니다.`,'창구 직원');
    await openTrade();
  }else if(b.id==='bank'){
    const rate=(DIFF[S.diff].rate*100).toFixed(1);
    if(!DF().loanCap)return say('죄송합니다. 요즘 같은 시장에선 은행이 아무에게도 대출해 드리지 않아요.\n...급하시면 저쪽 상어 형님을 찾으시겠죠.','은행원');
    const D=DIFF[S.diff],rule=`총자산의 ${D.loanMul}배, 최대 ${fmt(D.loanCap/10000)}만 원`;
    await say(`왕립 은행입니다. 이자는 하루 ${rate}%이고,\n대출 한도는 ${rule}까지입니다.`,'은행원');
    const UNITS=[LOAN,LOAN*5,LOAN*10];
    for(;;){
      const limit=Math.min(D.loanCap,Math.max(0,Math.floor(equity()*D.loanMul/LOAN)*LOAN)),room=Math.max(0,limit-S.debt);
      const c=await choose(`현재 대출 ${fmt(S.debt)}원 · 한도 ${fmt(limit)}원 · 더 빌릴 수 있는 돈 ${fmt(room)}원\n무엇을 도와드릴까요?`,['빌리기','갚기','나가기'],'은행원');
      if(c===0){
        if(room<LOAN){buzz();await say(`더 빌려드릴 수 없습니다. 대출 한도는 ${rule}까지예요.`,'은행원');continue}
        const ok=UNITS.filter(u=>u<=room);
        const opts=ok.map(u=>fmt(u/10000)+'만 원');
        if(room>ok[ok.length-1])opts.push(`한도까지 ${fmt(Math.floor(room/LOAN)*100)}만 원`);
        const k=await choose('얼마나 빌리시겠어요?',[...opts,'취소'],'은행원');
        if(k>=opts.length)continue;
        const amt=k<ok.length?ok[k]:Math.floor(room/LOAN)*LOAN;
        S.debt+=amt;S.cash+=amt;S.stats.loans++;coin();ach('loan');updateHUD();
        await say(`${fmt(amt)}원을 빌려드렸습니다. 총자산이 0 아래로 떨어지면... 아시죠?`,'은행원');
      }else if(c===1){
        if(!S.debt){await say('갚으실 대출이 없습니다.','은행원');continue}
        const opts=UNITS.filter(u=>u<S.debt).map(u=>fmt(u/10000)+'만 원').concat(`전부 (${fmt(S.debt)}원)`);
        const k=await choose('얼마나 갚으시겠어요?',[...opts,'취소'],'은행원');
        if(k>=opts.length)continue;
        const want=k===opts.length-1?S.debt:UNITS[k];
        const amt=Math.min(S.cash,want);
        if(amt<=0){buzz();await say('현금이 없으시네요. 주식을 먼저 파셔야 합니다.','은행원');continue}
        S.cash-=amt;S.debt-=amt;coin(true);updateHUD();
        await say(`${fmt(amt)}원을 갚으셨습니다.${amt<want?' (현금이 모자라 있는 만큼만 갚았어요)':''}${S.debt?` 남은 대출은 ${fmt(S.debt)}원입니다.`:' 대출을 모두 갚으셨어요!'}`,'은행원');
      }else break;
    }
  }else if(b.id==='tent'){
    const Nm='점쟁이 할멈',cost=Math.max(30000,Math.round(equity()*DF().fortuneCost/10000)*10000);
    await say('후후후... 오늘 장의 흐름을 엿보고 싶은가?',Nm);
    if(S.flags.fortune){await say('수정구슬도 쉬어야지. 내일 다시 오거라.',Nm);return}
    if(S.time>=CLOSE){await say('장이 끝났는데 무슨 점을 보누. 내일 아침에 오거라.',Nm);return}
    const c=await choose(`복채는 ${fmt(cost)}원이란다.`,['종목 하나 점치기','그만두기'],Nm);
    if(c!==0)return;
    if(S.cash<cost){buzz();await say('복채도 없는 자에게 보여줄 미래는 없다!',Nm);return}
    const k=await choose('어느 종목의 운명을 볼 텐가?',[...NAMES(),'취소'],Nm);
    if(k>=S.stocks.length)return;
    const st=S.stocks[k];
    if(st.dead){await say('죽은 종목의 미래는 볼 게 없다네...',Nm);return}
    S.cash-=cost;S.flags.fortune=true;S.stats.fortunes++;if(S.stats.fortunes>=5)ach('fortune');updateHUD();
    let up=S.next[st.id]>0;if(rand()>DIFF[S.diff].fortune)up=!up;
    tone(330,.4,'triangle',.05);tone(494,.4,'triangle',.05,.2);tone(740,.6,'triangle',.05,.4);
    await say('(수정구슬이 희미하게 빛난다...)');
    await say(up?`보인다... 오늘 ${INFO[st.id].name}에서 붉은 기운이 솟구치는구나!`:`보인다... 오늘 ${INFO[st.id].name} 위로 푸른 안개가 내려앉는구나...`,Nm);
    await say(`그리고... 요즘 이 종목엔 ${MODES[st.mode||'stable'].f} 기운이 며칠째 감돌고 있구나.`,Nm);
    await say('내 점은 꽤 잘 맞는 편이지. 가끔 틀릴 뿐. 믿고 말고는 자네 몫이야. 히히히.',Nm);
  }else if(b.id==='board'){
    const Nm='마을 게시판';
    if(S.day===1&&S.time<OPEN)await say('[공지] 모험가 마을 증권거래소 개장!\n장은 09:00~15:30, 하루 가격제한폭은 ±30%입니다.',Nm);
    else if(S.day>1){
      const ich=S.idxHist[S.idxHist.length-1]/S.idxHist[S.idxHist.length-2]-1;
      await say(`[어제 시황] 모험지수 ${S.idxHist[S.idxHist.length-1].toFixed(1)} (${pct(ich)})`+S.lastEvents.slice(0,3).map(e=>`\n· ${e.text}`).join(''),Nm);

    for(const r of S.rumors){
      const tag=S.flags.glass?(r.truth?'\n(돋보기로 보니... 진짜다!)':'\n(돋보기로 보니... 가짜다!)'):'';

    }
    if(!S.flags.glass)await say('게시판 구석에 낙서가 있다.\n"여기 소문 다 믿지 마셈 -김씨"');
  }
}
const KIM_LINES=['어제 고블린코인 풀매수했어요. 오늘은 꼭 간다니까요!','물타기를 하다 보니 제가 물이 됐어요.','상한가 따라잡기는 개미의 국룰이죠. 아, 저 어제도 꼭대기에서 샀어요.','여기선 빨간색이 오르는 거예요. 제 계좌는... 시원한 파란색이에요.','"무릎에서 사서 어깨에서 팔아라"래요. 근데 무릎이 어디예요?','속보 뜨고 사면 이미 늦어요. 소문에 사서 뉴스에 팔라던데...','공매도요? 떨어질 거 같으면 빌려서 팔고, 나중에 싸게 사서 갚는 거래요. 무섭죠?'];
const PARK_LINES=['낚시도 주식도 기다림이야. ...벌써 3년째 기다리는 중이지만.','난 마왕건설에 물려 있다네. 본전 오면 판다, 본전만 오면...','물고기는 미끼를 물고, 개미는 소문을 물지.','손절도 실력이야. 난 그 실력이 없어서 여기 있는 거고.','10일, 20일, 30일엔 배당이 나오지. 오크푸드 배당이 쏠쏠하다네.'];
async function talk(n){
  n.dir=OPP[P.dir];if(n.cat)n.face=P.dir==='left'?'right':'left';
  n.talking=true;
  try{
    if(n.id==='kim'){
      if(!S.quests.kim&&(S.pos.GBC?.qty||0)>=100){
        S.quests.kim=true;S.cash+=50000;coin();ach('quest');updateHUD();
        await say('어?! 고블린코인 100주 넘게 들고 계시네요! 진정한 동지시군요!',n.name);
        await say('동지 기념으로 제 비상금 5만 원 드릴게요. 같이 투 더 문!',n.name);
      }else if(!S.quests.kim&&rand()<.4)await say('고블린코인 100주 이상 들고 오시면 동지로 인정해 드릴게요. 선물도 있어요!',n.name);
      else await say(pick(KIM_LINES),n.name);
    }else if(n.id==='park'&&inBk()){
      const c=await choose(`허허, 왔는가. 오늘은 뭘 하겠나?\n(남은 회생 빚 ${fmt(S.bk.debt)}원 · 오늘 밤 변제금 ${fmt(S.bk.daily)}원 · 현금 ${fmt(S.cash)}원)`,[`낚시 알바 (1시간 · 남은 ${jobsLeft()}번)`,'벤치에서 잔다','이야기'],n.name,2);
      if(c===0){
        if(jobsLeft()<=0)await say('오늘은 그만하게. 몸 상하면 회생이고 뭐고 없어.',n.name);
        else if(S.time>=NIGHT_END-60)await say('이 밤중에 무슨 낚시야. 자게나.',n.name);
        else await fishingJob();
      }else if(c===1)await goSleep();
      else await say(pick(['나도 처음엔 자네처럼 레버리지를 좋아했지...','회생은 끝이 있어. 내 물린 주식은 끝이 없지만. 허허.','하루하루 갚다 보면 길이 보이네. 물고기도 기다리면 오지.','다시 일어난 개미를 "불사조 개미"라고 부른다더군. 자네가 그게 되면 좋겠네.']),n.name);
    }else if(n.id==='park'){
      const p=S.pos.DMN,dm=stockOf('DMN');
      if(!S.quests.park&&p&&dm.price/p.avg-1>=.2){
        S.quests.park=true;S.cash+=100000;coin();ach('quest');updateHUD();
        await say('자네... 마왕건설로 20% 넘게 벌었다고? 내 3년 한을 풀어줬구먼!',n.name);
        await say('오늘 잡은 물고기 판 돈이야. 10만 원 받게나.',n.name);
      }else if(!S.quests.park&&rand()<.4)await say('누가 마왕건설로 20%만 벌어서 보여주면 소원이 없겠네...',n.name);
      else await say(pick(PARK_LINES),n.name);
    }else if(n.id==='choi'){
      if(S.day===1)await say('모험증권 리서치센터 최부장입니다. 제 의견은 언제나 "매수"입니다.\n이유요? 저도 몰라요.',n.name);
      else{
        const ich=S.idxHist[S.idxHist.length-1]/S.idxHist[S.idxHist.length-2]-1,st=pick(S.stocks.filter(s=>!s.dead));
        await say(ich>=0?'보셨죠? 제가 뭐랬습니까. 목표치 상향!\n지금이라도 타셔야 합니다.':'건전한 조정입니다. 이럴 때가 바로 저점 매수 기회죠.\n목표치 상향!',n.name);
        await say(`오늘의 추천주는 ${INFO[st.id].name}! 목표주가 ${fmt(roundTick(st.price*(1.3+rand()*.7)))}원입니다.\n(근거는 없습니다)`,n.name);
      }
    }else if(n.id==='lupin'){
      const Nm=n.name;
      if(S.flags.lupinSold){await say('오늘 장사는 끝났어. 욕심은 화를 부르는 법이지.',Nm);return}
      await say('쉿... 좋은 물건 있어. 금융감독원엔 비밀이야.\n단, 한 사람한테 하루 하나만 판다.',Nm);
      const priceOf=it=>it.rate?Math.max(it.price,Math.round(equity()*it.rate/10000)*10000):it.price;
      for(;;){
        const opts=ITEMS.map(it=>`${it.name} ${fmt(priceOf(it))}원`);
        const c=await choose('뭘 살 텐가?\n'+ITEMS.map(it=>`· ${it.name}: ${it.desc}`).join('\n'),[...opts,'나가기'],Nm);
        if(c>=ITEMS.length)break;
        const it={...ITEMS[c],price:priceOf(ITEMS[c])};
        if(S.cash<it.price){buzz();await say('돈이 모자라잖아. 장사 하루 이틀 하나.',Nm);continue}
        if(it.id==='sand'&&S.seed!=null){await say('이 시장은 운명이 고정돼 있어서 모래시계가 안 먹혀. 다른 걸 골라.',Nm);continue}
        if(it.id==='sand'&&!marketOpen()){await say('모래시계는 장중에만 효과가 있어. 장 열리면 다시 와.',Nm);continue}
        let target=null;
        if(it.id==='tip'){
          const k=await choose('어느 종목 쪽지를 줄까?',[...NAMES(),'취소'],Nm);
          if(k>=S.stocks.length)continue;
          target=S.stocks[k];
          if(target.dead){await say('그 회사는 이미 없어졌어.',Nm);continue}
        }
        S.cash-=it.price;S.flags.lupinSold=true;coin();ach('shop');updateHUD();
        if(it.id==='tip'){
          const B=[[-.3,-.15],[-.15,-.05],[-.05,0],[0,.05],[.05,.15],[.15,.3]];
          const r=S.path[target.id][N]/target.prev-1;
          let bi=B.findIndex(([a,b])=>r>=a&&r<b);if(bi<0)bi=r<0?0:5;
          if(rand()<.2)bi=pick([0,1,2,3,4,5].filter(x=>x!==bi));
          const [a,b]=B[bi],pf=x=>(x>0?'+':'')+Math.round(x*100)+'%';
          await say(`(구겨진 쪽지를 펼쳤다)\n"${INFO[target.id].name}, 오늘 ${pf(a)} ~ ${pf(b)} 사이로 마감 예정"\n(쪽지 뒷면: 가끔 찌라시가 섞여 있음. 책임 안 짐)`);
        }else if(it.id==='glass'){S.flags.glass=true;await say('진실의 돋보기를 얻었다! 오늘 게시판 소문의 진위를 알 수 있다.')}
        else if(it.id==='sand'){
          const t0=S.time;S.time=Math.max(OPEN,S.time-120);
          const i0=Math.floor((S.time-OPEN)/STEP);
          for(const e of S.events)if(OPEN+(e.step+DF().lag)*STEP>S.time)e.fired=false;
          rerollFuture(i0);updatePrices();ach('sand');
          await say(`모래시계를 뒤집었다... 세상이 빙글 돈다!\n시간이 ${hhmm(t0)}에서 ${hhmm(S.time)}(으)로 돌아갔다.\n하지만 미래는 다시 정해진다. 아까 본 시세가 또 온다는 보장은 없다.`);
        }else if(it.id==='snack'){S.flags.snack=true;await say('고급 츄르를 샀다. 고양이에게 가 보자.')}
        break;
      }
      await say('또 보자고. 내가 언제 올지는 나도 몰라.',Nm);
    }else if(n.id==='daisy'){
      const Nm=n.name,price=S.tw.base;
      await say(`황금무 사세요~ 일요일 정오까지만 팔아요!\n오늘은 1개에 ${fmt(price)}원이에요.`,Nm);
      await say('월요일부터 토요일까지 미믹 매입상자가 오전·오후 시세로 사 줘요.\n그런데 일주일 지나면 썩으니까 꼭 다음 일요일 전에 파세요!',Nm);
      const mx=Math.floor(S.cash/price);
      const opts=[10,50,100].filter(x=>x<=mx).map(x=>`${x}개 (${fmt(x*price)}원)`);
      if(mx>0)opts.push(`최대 ${fmt(mx)}개`);
      const c=await choose('몇 개 살래요?',[...opts,'안 살래요'],Nm);
      if(c>=opts.length)return;
      const q=c===opts.length-1?mx:[10,50,100].filter(x=>x<=mx)[c];
      const t=S.tn||(S.tn={qty:0,avg:0,bought:S.day});
      t.avg=(t.avg*t.qty+q*price)/(t.qty+q);t.qty+=q;t.bought=S.day;S.cash-=q*price;coin();updateHUD();
      await say(`황금무 ${fmt(q)}개를 샀다! (보유 ${fmt(t.qty)}개)`);
    }else if(n.id==='mimic'&&inBk()&&!(S.tn&&S.tn.qty&&turnipPrice())){
      const c=await choose('덜컹. (상자 안이 엉망이다. 정리하면 금화를 줄 것 같다)',[`정리 알바 (4만 원? · 1시간 · 남은 ${jobsLeft()}번)`,'그만둔다'],n.name);
      if(c!==0)return;
      if(jobsLeft()<=0){await say('오늘은 너무 지쳤다. 알바는 내일 하자.');return}
      if(rand()<.2){buzz();await jobDone(0,60,'상자 안을 정리하다가... 콱! 손을 물렸다.\n상자는 아무것도 주지 않았다.')}
      else await jobDone(40000,60,'상자 안의 택배들을 차곡차곡 정리했다. 상자가 만족스럽게 덜컹거린다.');
    }else if(n.id==='mimic'){
      const Nm=n.name,tp=turnipPrice();
      tone(180,.15,'sawtooth',.03);
      if(wdOf(S.day)===0){await say('(상자가 꿈쩍도 하지 않는다. 일요일은 쉬는 날인 것 같다.)');return}
      if(!tp){await say('덜컹덜컹. (황금무 시세표가 비어 있다)',Nm);return}
      const t=S.tn;
      await say(`덜컹! ${S.time<720?'오전':'오후'} 황금무 매입가 1개 ${fmt(tp)}원!\n${t?`(가진 황금무 ${fmt(t.qty)}개 · 산 값 ${fmt(t.avg)}원)`:'(가진 황금무가 없다)'}`,Nm);
      if(!t||!t.qty)return;
      const c=await choose(`전부 팔면 ${fmt(t.qty*tp)}원. 팔까?`,['전부 판다','안 판다'],Nm);
      if(c!==0)return;
      S.cash+=t.qty*tp;if(tp>=t.avg*2)ach('turnip');
      const pl=(tp-t.avg)*t.qty;S.stats.realized+=pl;S.tn=null;coin();updateHUD();
      await say(`상자가 황금무를 꿀꺽 삼키고 금화를 뱉어냈다. (${pl>=0?'+':''}${fmt(pl)}원)`);
    }else if(n.id==='goblin'&&inBk()){
      await say('회생 중인 친구는 안 받아. 법원이 보고 있다고. 키킥.',n.name);
    }else if(n.id==='goblin'){
      const Nm=n.name,cnt=S.flags.races||0;
      if(cnt>=3){await say('오늘 경주는 끝났어. 내일 또 와, 친구. 키키킥.',Nm);return}
      await say(`슬라임 경주에 오신 걸 환영해! 오늘 남은 경주는 ${3-cnt}번.\n배당은 빨강 2배, 파랑 3배, 초록 5배, 금색 12배야.`,Nm);
      const k=await choose('어느 슬라임에 걸래?',[...SLIMES.map(s=>`${s.name} (${s.odds}배)`),'안 걸래'],Nm);
      if(k>=SLIMES.length)return;
      const bets=[10000,100000,1000000].filter(x=>x<=S.cash);
      if(!bets.length){buzz();await say('빈털터리는 사절이야.',Nm);return}
      const bi=await choose('얼마나 걸래?',[...bets.map(x=>fmt(x)+'원'),'그만둘래'],Nm);
      if(bi>=bets.length)return;
      const bet=bets[bi];S.cash-=bet;S.flags.races=cnt+1;updateHUD();
      let t=rand(),w=0;for(;w<SLIMES.length-1;w++){if((t-=SLIMES[w].p)<=0)break}
      const lead=pick(SLIMES),slip=pick(SLIMES.filter(s=>s!==lead));
      tone(523,.1,'square',.03);tone(659,.1,'square',.03,.12);tone(784,.2,'square',.03,.24);
      await say(`출발! ${lead.name}이 먼저 통통 튀어 나갑니다!`,'실황');
      await say(`아앗, ${slip.name}이 웅덩이에 미끄러졌습니다! 결승선이 다가옵니다...`,'실황');
      if(w===k){
        const prize=bet*SLIMES[w].odds;S.cash+=prize;coin();if(w===3)ach('race');updateHUD();
        await say(`1등은 ${SLIMES[w].name}!\n적중! ${fmt(prize)}원을 받았다!`,'실황');
      }else{buzz();await say(`1등은 ${SLIMES[w].name}!\n${fmt(bet)}원이 고블린 주머니로 들어갔다...`,'실황')}
    }else if(n.id==='shark'&&inBk()){
      await say('파산자한텐 안 빌려줘. 받을 게 없잖아.\n...회생 끝나면 다시 와. 그땐 친구지.',n.name);
    }else if(n.id==='shark'){
      const Nm=n.name;
      if(!S.shark){
        await say(`급전 필요해? 신용 따윈 안 봐.\n대신 이자는 하루 ${Math.round(sharkRate()*100)}%, ${sharkDays()}일 안에 원리금 전부 갚아.`,Nm);
        await say('기한 넘기면... 네 계좌는 내가 알아서 정리한다. 주식이고 뭐고 싹 다.',Nm);
        const amts=[1000000,5000000,10000000];
        const c=await choose('얼마 필요해?',[...amts.map(x=>fmt(x/10000)+'만 원'),'됐어요'],Nm);
        if(c>=amts.length)return;
        S.shark={amt:amts[c],due:S.day+sharkDays()};S.cash+=amts[c];coin();updateHUD();
        await say(`${fmt(amts[c])}원 받아. ${S.shark.due}일차 장 마감 전까지다. 잊지 마.`,Nm);
      }else{
        const left=S.shark.due-S.day;
        const c=await choose(`빚 ${fmt(S.shark.amt)}원. 기한까지 ${left}일 남았어.${left<=1?'\n오늘 밤 넘기면 정리 들어간다.':''}`,['전부 갚기','나중에'],Nm);
        if(c!==0)return;
        if(S.cash<S.shark.amt){buzz();await say(`현금이 ${fmt(S.shark.amt-S.cash)}원 모자라잖아. 주식 팔아서 와.`,Nm);return}
        S.cash-=S.shark.amt;S.shark=null;coin(true);ach('shark');updateHUD();
        await say('깔끔하군. 또 급하면 찾아와.',Nm);
      }
    }else if(n.cat){
      tone(880,.08,'triangle',.05);tone(700,.12,'triangle',.05,.08);
      if(!S.flags.cat){
        S.flags.cat=true;S.stats.cat++;if(S.stats.cat>=5)ach('cat');
        if(S.flags.snack){
          // 츄르: 돈을 물어오거나, 종목 하나를 쳐다보거나, 먹고 도망간다
          S.flags.snack=false;
          await say('츄르 봉지를 뜯었다... 냐아아아옹!!',n.name);
          const t=rand();
          if(t<.4){
            const gain=pick([20000,50000,50000,100000,300000]);S.cash+=gain;coin();updateHUD();
            await say(`고양이가 어디선가 금화 주머니를 물어 왔다!\n${fmt(gain)}원을 얻었다!`);
          }else if(t<.75){
            const live=S.stocks.filter(s=>!s.dead),ups=live.filter(s=>S.next[s.id]>0),downs=live.filter(s=>S.next[s.id]<=0);
            const st=(rand()<.6&&ups.length)||!downs.length?pick(ups.length?ups:live):pick(downs);
            await say(`고양이가 거래소 전광판 앞에 앉아\n${INFO[st.id].name} 글자를 뚫어지게 쳐다본다...\n(무슨 뜻일까? 고양이는 대답이 없다)`);
          }else{
            NPCS=NPCS.filter(x=>x!==n);
            await say('고양이가 츄르만 쏙 먹고 담장 너머로 사라졌다.\n...오늘은 돌아오지 않을 것 같다.');
          }
        }else{
          const gain=pick([100,500,500,1000,5000]);S.cash+=gain;updateHUD();
          await say('냐아옹.',n.name);
          await say(`고양이가 다리에 몸을 비빈다.\n발밑에서 ${fmt(gain)}원을 주웠다!`);
        }
      }else await say('고양이는 햇볕 아래에서 졸고 있다.\n주식에는 관심이 없어 보인다.');
    }
  }finally{n.talking=false}
}
function targetOf(){const [dx,dy]=DV[P.dir];return [P.x+dx,P.y+dy]}
function interactable(x,y){
  if(npcAt(x,y))return true;
  const b=buildingAt(x,y);return !!(b&&b.door[0]===x&&b.door[1]===y);
}
function interact(){
  const [x,y]=targetOf();
  const n=npcAt(x,y);if(n)return run(()=>talk(n));
  const b=buildingAt(x,y);if(b&&b.door[0]===x&&b.door[1]===y)return run(()=>enter(b));
  if(tileAt(x,y)==='~')return run(()=>say('물고기가 헤엄친다.\n박씨의 미끼에는 관심이 없어 보인다.'));
  if(lampAt(x,y))return run(()=>say(S.time>=1080?'가로등이 따뜻하게 빛난다.':'가로등이다. 밤이 되면 켜진다.'));
}

/* ================= 엔딩 ================= */
function rankOf(eq){
  if(eq>=S.goal*10)return ['전설의 큰손','마을 광장에 당신의 동상이 세워졌다.'];
  if(eq>=S.goal)return ['주식의 용사','할머니와의 약속을 지켰다! 마을이 당신을 기억할 것이다.'];
  if(eq>=S.goal*.3)return ['슈퍼개미','목표엔 못 미쳤지만 개미들 사이에선 이미 전설이다.'];
  if(eq>=S.start)return ['살아남은 개미','원금을 지켰다. 이것만으로도 상위권이다.'];
  if(eq>=S.start*.3)return ['수업료 납부 완료','비싼 공부를 했다. 김씨가 어깨를 토닥여 준다.'];
  return ['깡통 계좌 장인','계좌가 텅 비었다. 박씨 옆에서 낚시나 배우자.'];
}
function routeRank(eq){
  if(S.bk&&!S.bk.done)return ['현재진행형 개미','빚은 아직 남았지만, 매일 조금씩 갚아 나가고 있다. 이야기는 계속된다.'];
  if(eq>=S.goal){ach('phoenix');return ['불사조 개미','한 번 무너졌지만 다시 일어나 약속을 지켰다. 마을 사람들이 당신의 이야기를 전설처럼 이야기한다.']}
  if(eq>=S.start)return ['재기 성공','파산의 바닥에서 원금을 되찾았다. 박씨가 벤치 자리를 치우며 웃는다.'];
  return ['평범한 삶','빚은 다 갚았다. 큰돈은 없지만 다시 집에서 잘 수 있다. 그거면 충분하다.'];
}
function ending(kind){
  if(S.multi){S.multi.out=kind==='bankrupt'||kind==='fail';pushPresence()}
  mode='end';clearSave(S.multi?'multi':null);updateHUD();
  const eq=equity(),ret=eq/S.start-1,over=kind==='bankrupt'||kind==='fail';
  const [rank,line]=kind==='bankrupt'?(S.bkCount?['두 번째 파산','한 번은 일어섰지만, 두 번째는 없었다. 은행원이 조용히 벤치 자리를 가리킨다...']:['파산','총자산이 0 아래로 떨어진 채 마지막 날을 맞았다. 은행원이 집 문을 두드린다...'])
    :kind==='fail'?['박씨의 옆자리','변제금을 세 번 내지 못해 회생이 폐지되었다. 오늘부터 박씨와 나란히 낚싯대를 드리운다.']
    :kind==='multi'?(()=>{const [me,n]=myRank();return [me===1?'방 1등!':`${me}등 / ${n}명`,me===1?'모두가 같은 시장에서 싸웠고, 당신이 이겼다.':'같은 시장, 다른 선택. 다음 판엔 역전하자.']})()
    :S.diff==='hell'&&eq>=S.goal?(ach('hell'),['지옥에서 온 개미','극악의 시장에서 1억을 만들어 냈다. 마을 사람들은 이걸 전설이 아니라 괴담으로 이야기한다.'])
    :S.bkCount?routeRank(eq):rankOf(eq);
  const best=readJSON(KEY_BEST);
  const newBest=!over&&!S.multi&&(!best||ret>best.ret);
  if(S.challenge&&!over)ach('daily');
  const modeName=S.multi?`멀티 [${S.multi.code}]`:S.challenge?`오늘의 시장 ${S.challenge}`:'혼자 하기';
  const shareText=`개미 퀘스트 · ${modeName} · ${DIFF[S.diff].name}\n${rank} · ${fmt(eq)}원 (${pct(ret)})\nhttps://oh-bj.github.io/ant-quest/`;
  if(newBest)writeJSON(KEY_BEST,{ret,eq,rank,diff:DIFF[S.diff].name});
  $('#endWin').innerHTML=`<div class="dim">${over?`${S.day-1}일차 · 게임 오버`:`${totalDays()}일 결산`} · ${DIFF[S.diff].name}${S.multi?' · 멀티':''}${S.challenge?' · 오늘의 시장 '+S.challenge:''}${S.bkCount?' · 파산 루트':''}${newBest?' · <span class="gold">최고 기록!</span>':''}</div>
    <div class="rank" id="endRankT">${rank}</div><p style="margin:0" id="endRankL">${line}</p>
    <canvas id="endChart" class="chart" width="640" height="220"></canvas>
    <dl class="kv num"><div><dt>최종 총자산</dt><dd class="${cls(ret)}">${fmt(eq)}원</dd></div><div><dt>수익률</dt><dd class="${cls(ret)}">${pct(ret)}</dd></div>
    <div><dt>최고 자산</dt><dd>${fmt(S.stats.peak)}원</dd></div><div><dt>거래 횟수</dt><dd>${S.stats.trades}회</dd></div>
    <div><dt>수수료·세금</dt><dd>${fmt(S.stats.fees)}원</dd></div><div><dt>받은 배당</dt><dd>${fmt(S.stats.divs)}원</dd></div>
    ${S.bk?`<div><dt>파산한 날</dt><dd>${S.bk.start}일차</dd></div><div><dt>회생 빚</dt><dd>${S.bk.done?'완제':fmt(S.bk.debt)+'원 남음'}</dd></div>`:''}
    <div><dt>업적</dt><dd>${ACH.filter(a=>S.ach[a[0]]).length} / ${ACH.length}</dd></div><div><dt>대출 횟수</dt><dd>${S.stats.loans}회</dd></div></dl>
    ${kind==='multi'?`<p class="foot" id="endRkNote">다른 사람들의 최종 결과를 모으는 중...</p><div id="endRk">${rankTable()}</div>`:''}
    <div class="rowbtns"><button id="endShare">결과 복사</button><button class="focus" id="endOk">타이틀로 ▶</button></div>`;
  $('#end').hidden=false;$('#fade').style.opacity=0;
  drawChart($('#endChart'),S.eqHist,{base:S.start,fmt:v=>fmt(v/10000)+'만',avg:S.goal<=S.stats.peak*1.5?S.goal:null,avgLabel:'목표',label:'일별 총자산'});
  if(!over&&eq>=S.goal)jingle();else tone(220,.5,'triangle',.05);
  const close=()=>{popUI();$('#end').hidden=true;if(S.multi){pushPresence();leaveRoom()}showTitle()};
  $('#endOk').onclick=close;
  if(kind==='multi'){
    // 모두가 같은 순간에 끝나므로, 몇 초 동안 서로의 마지막 결과를 받아 순위를 다시 그린다
    let n=0;
    const iv=setInterval(()=>{
      if(mode!=='end'||!$('#endRk')){clearInterval(iv);return}
      pushPresence();
      const [me,cnt]=myRank();
      $('#endRankT').textContent=me===1?'방 1등!':`${me}등 / ${cnt}명`;
      $('#endRankL').textContent=me===1?'모두가 같은 시장에서 싸웠고, 당신이 이겼다.':'같은 시장, 다른 선택. 다음 판엔 역전하자.';
      $('#endRk').innerHTML=rankTable();
      if(++n>=8){clearInterval(iv);$('#endRkNote').textContent='최종 순위가 확정됐어요.';if(me===1&&cnt>1)ach('mvp')}
    },1000);
  }
  $('#endShare').onclick=()=>{
    const fb=()=>{const ta=document.createElement('textarea');ta.value=shareText;ta.style.cssText='width:100%;height:5em;font:inherit';$('#endShare').replaceWith(ta);ta.select();toast('복사할 수 없어서 글을 띄웠어요. 길게 눌러 복사하세요')};
    try{navigator.clipboard.writeText(shareText).then(()=>toast('결과를 복사했어요. 카톡에 붙여넣어 보세요!'),fb)}catch(e){fb()}
  };
  pushUI({type:'end',key(k){if(k==='ok')close()}});
}

/* ================= 타이틀 ================= */
function showTitle(){
  mode='title';updateHUD();
  const sv=loadSave(),mv=loadMulti();
  const items=[];
  if(sv)items.push([`이어하기 (${sv.challenge?'오늘의 시장 · ':''}${DIFF[sv.diff].name} · ${sv.day}일차)`,()=>continueGame(sv)]);
  if(mv)items.push([`멀티 이어하기 (방 ${mv.multi.code} · ${mv.day}일차)`,()=>continueMulti(mv)]);
  items.push(['새로 시작',()=>pickDifficulty()],[`오늘의 시장 도전 (${todayKey()})`,()=>startDaily()],['같이 하기 (멀티)',()=>multiMenu()]);
  const opts=items.map(x=>x[0]);
  let sel=0;
  const m=$('#titleMenu');
  const best=readJSON(KEY_BEST),ga=readJSON(KEY_ACH)||{};
  $('#titleBest').textContent=(best?`최고 기록: ${best.rank} · ${fmt(best.eq)}원 (${pct(best.ret)}, ${best.diff}) · `:'')+`모은 업적 ${ACH.filter(a=>ga[a[0]]).length}/${ACH.length}`;
  const render=()=>{m.innerHTML=opts.map((o,i)=>`<button class="opt${i===sel?' on':''}" data-i="${i}">${o}</button>`).join('')};
  const done=i=>{popUI();$('#title').hidden=true;m.onclick=null;blip(820);items[i][1]()};
  m.onclick=e=>{const b=e.target.closest('.opt');if(b){unlockAudio();done(+b.dataset.i)}};
  $('#title').hidden=false;render();
  pushUI({type:'title',key(k){
    if(k==='up'){sel=(sel+opts.length-1)%opts.length;render();blip(520)}
    else if(k==='down'){sel=(sel+1)%opts.length;render();blip(520)}
    else if(k==='ok')done(sel);
  }});
}
async function pickDifficulty(){
  mode='title';
  const keys=Object.keys(DIFF);
  const c=await choose('난이도를 골라 주세요.\n'+keys.map(k=>`· ${DIFF[k].name}: ${DIFF[k].desc}`).join('\n'),keys.map(k=>DIFF[k].name).concat('돌아가기'));
  if(c>=keys.length)return showTitle();
  newGame(keys[c]);
}
const todayKey=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
function startDaily(){
  const key=todayKey(),seed=[...key].reduce((a,c)=>Math.imul(a^c.charCodeAt(0),16777619)>>>0,2166136261);
  newGame('normal',seed,key);
}
function newGame(diff,seed=null,challenge=null){
  clearSave();S=newState(diff,seed);S.challenge=challenge;rollDay();placePlayer(S.player);resetNPCs();mode='play';updateHUD();
  run(async()=>{
    if(S.challenge)await say(`오늘의 시장 도전 (${S.challenge})\n오늘 이 모드를 하는 사람은 모두 똑같은 시장을 만나요.\n끝나면 결과를 복사해서 친구와 비교해 보세요!`,'도움말');
    await say('(책상 위에 편지가 놓여 있다.)');
    await say(`"모험가에게.\n이 ${fmt(S.start/10000)}만 원으로 30일 안에 ${fmt(S.goal/10000)}만 원을 만들어 보거라.\n못 하면... 그냥 밥 먹으러 오렴. -할머니"`,'할머니의 편지');
    await say('위쪽 가운데 큰 건물이 증권거래소다. 장은 09:00에 열려 15:30에 닫히고, 시세는 실시간으로 움직인다.','도움말');
    await say('장중에는 [속보]가 뜨며 주가가 크게 출렁인다. 게시판 소문을 보고 미리 움직이면 큰돈을 벌 수도... 잃을 수도 있다.','도움말');
    await say('점집, 은행, 가끔 찾아오는 수상한 상인도 이용해 보자.\n집에서 자면 다음 날로 넘어간다. M 키로 내 계좌와 업적을 볼 수 있다.','도움말');
    await say('오늘은 일요일. 집 앞에 무 장수가 와 있다.\n주식 말고도 황금무, 슬라임 경주, 사채업자... 이 마을엔 돈 벌 (그리고 잃을) 방법이 많다.','도움말');
  });
}
function continueGame(sv){
  S=sv;S.bkCount=S.bkCount||0;S.bk=S.bk||null;placePlayer(S.player||{x:4,y:5,dir:"down"});resetNPCs();updatePrices();mode='play';updateHUD();
  run(()=>say(`${S.day}일차 ${hhmm(S.time)}. 다시 마을로 돌아왔다.`));
}

const SB_URL='https://htvogtgmmcsbztdjieps.supabase.co',SB_KEY='sb_publishable_xhFjs4O3qoTAPNeyxOg3jg_EcBJeSRd';
const SEG_W=[1,9,2],dayMsOf=()=>S&&S.multi&&S.multi.dayMs||180000;
const PAL=['#3d7be0','#e0703a','#5aa84a','#b04ad0','#d4b02a','#2ab3b0','#e04870','#8a6a4a'];
let sb=null,chan=null,OTHERS={},lastPresence=0,lastMv=null,myBubble=null,MYID=null;
function myId(){
  if(MYID)return MYID;
  try{MYID=localStorage.getItem('ant-quest-id')}catch(e){}
  if(!MYID){MYID=Math.random().toString(36).slice(2,10);try{localStorage.setItem('ant-quest-id',MYID)}catch(e){}}
  return MYID;
}
const colOf=id=>PAL[[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
function sbClient(){if(!sb&&window.supabase)sb=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{worker:true,heartbeatIntervalMs:15000}});return sb}
function presenceMeta(){
  const M=S.multi,eq=equity();
  return {id:myId(),name:M.name,host:M.host,cfg:{seed:M.seed,diff:S.diff,days:M.days,dayMs:M.dayMs,startAt:M.startAt},
    eq:Math.round(eq),ret:eq/S.start-1,day:S.day,x:P.x,y:P.y,dir:P.dir,out:!!M.out};
}
function pushPresence(){if(chan&&S&&S.multi){lastPresence=performance.now();chan.track(presenceMeta()).catch(()=>{})}}
function roomMetas(){if(!chan)return [];return Object.values(chan.presenceState()).map(a=>a[a.length-1]).filter(Boolean)}
function ranking(){
  const list=Object.entries(OTHERS).map(([id,o])=>({id,name:o.name,eq:o.eq,ret:o.ret||0,out:o.out,host:o.host}));
  if(S&&S.multi)list.push(presenceMeta());
  return list.sort((a,b)=>(b.out?-1e9:b.ret)-(a.out?-1e9:a.ret));
}
function myRank(){const rk=ranking(),me=rk.find(m=>m.id===myId());return [me?1+rk.filter(m=>!m.out&&m.ret>me.ret+1e-9).length:rk.length,rk.length]}
function connectRoom(code,keep=false){
  return new Promise((res,rej)=>{
    const c=sbClient();if(!c)return rej(new Error('nolib'));
    leaveRoom(keep);
    chan=c.channel('ant-quest:'+code,{config:{presence:{key:myId()},broadcast:{self:false}}});
    chan.on('presence',{event:'sync'},onSync);
    chan.on('broadcast',{event:'mv'},({payload:m})=>{const o=OTHERS[m.id];if(!o)return;o.x=m.x;o.y=m.y;o.tx=m.tx;o.ty=m.ty;o.t=0;o.moving=m.x!==m.tx||m.y!==m.ty;o.dir=m.dir});
    chan.on('broadcast',{event:'chat'},({payload:m})=>{const o=OTHERS[m.id];if(o){o.bubble=m.text;o.bubbleT=5}toast(`${m.name}: ${m.text}`);tone(1046,.05,'triangle',.03)});
    chan.on('broadcast',{event:'start'},({payload:m})=>{if(S&&S.multi&&!S.multi.startAt){S.multi.startAt=m.startAt;save();toast('방장이 게임을 시작했어요!','news');bell()}});
    let done=false;
    const timer=setTimeout(()=>{if(!done){done=true;rej(new Error('timeout'))}},10000);
    chan.subscribe(st=>{
      if(st==='SUBSCRIBED'&&!done){done=true;clearTimeout(timer);res()}
      else if((st==='CHANNEL_ERROR'||st==='TIMED_OUT')&&!done){done=true;clearTimeout(timer);rej(new Error(st))}
    });
  });
}
function onSync(){
  const seen=new Set();
  for(const m of roomMetas()){
    if(m.id===myId())continue;
    seen.add(m.id);
    let o=OTHERS[m.id];
    if(!o){o=OTHERS[m.id]={x:m.x,y:m.y,tx:m.x,ty:m.y,t:0,moving:false,dir:m.dir||'down'};toast(`${m.name} 님이 들어왔어요`)}
    o.name=m.name;o.col=colOf(m.id);o.eq=m.eq;o.ret=m.ret;o.out=m.out;o.host=m.host;o.gone=0;
    if(!o.moving&&(o.x!==m.x||o.y!==m.y)){o.x=o.tx=m.x;o.y=o.ty=m.y}
    if(S&&S.multi&&!S.multi.startAt&&m.cfg&&m.cfg.startAt&&m.cfg.seed===S.multi.seed){S.multi.startAt=m.cfg.startAt;save()}
  }
  // 접속 목록은 잠깐씩 비었다 다시 채워지므로, 8초 넘게 안 보일 때만 나간 것으로 본다
  for(const id in OTHERS)if(!seen.has(id)&&!OTHERS[id].gone)OTHERS[id].gone=Date.now();
}
function leaveRoom(keep=false){if(chan&&sb)sb.removeChannel(chan);chan=null;if(!keep)OTHERS={};lastMv=null}
// 연결이 끊기면(폰에서 다른 앱을 보다 오는 경우 등) 같은 방에 다시 들어간다
let reconnecting=false,lastConnCheck=0;

  if(!S||!S.multi||reconnecting||(mode!=='play'&&mode!=='end')||!sbClient())return;
  if(chan&&(chan.state==='joined'||chan.state==='joining'))return;

}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastConnCheck=0;ensureConn()}});
async function waitCfg(ms){
  const end=Date.now()+ms;
  while(Date.now()<end){
    const list=roomMetas().filter(m=>m.cfg&&m.cfg.seed!=null);
    const h=list.find(m=>m.host)||list[0];
    if(h)return h.cfg;
    await wait(250);
  }
  return null;
}

    if(k>=keys.length)return multiMenu();
    const lens=[30,20,10],speeds=[[2,'빠르게'],[3,'보통'],[4,'느긋하게']];
    const sp=await choose('하루를 실제로 몇 분으로 할까요?\n(장이 열려 있는 시간은 그중 4분의 3이에요)',speeds.map(([m,t])=>`${t} · 하루 ${m}분`).concat('돌아가기'),null,3);
    if(sp>=speeds.length)return multiMenu();
    const mins=speeds[sp][0],hm=d=>{const t=d*mins;return t>=60?`약 ${Math.floor(t/60)}시간${t%60?` ${t%60}분`:''}`:`약 ${t}분`};
    const ln=await choose('몇 일짜리 판으로 할까요?',lens.map(d=>`${d}일 (${hm(d)})`).concat('돌아가기'),null,3);
    if(ln>=lens.length)return multiMenu();
    const code=genCode();
    try{await connectRoom(code)}catch(e){leaveRoom();await say('서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');return showTitle()}
    startMulti({code,seed:Math.floor(Math.random()*2147483647),diff:keys[k],days:lens[ln],dayMs:mins*60000,startAt:null,host:true,name});
    pushPresence();
    await say(`방을 만들었어요! 방 코드는 [ ${code} ] 예요. (${lens[ln]}일 · 하루 ${mins}분)\n친구에게 코드를 알려 주고, 다 모이면 M 메뉴에서 "게임 시작"을 눌러 주세요.`,'멀티');
  }else{
    const code=((await ask('방 코드 4글자를 입력해 주세요.','ABCD',4))||'').toUpperCase().replace(/[^A-Z]/g,'');
    if(code.length!==4)return multiMenu();
    toast('방을 찾는 중...');
    try{await connectRoom(code)}catch(e){leaveRoom();await say('서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');return showTitle()}
    const cfg=await waitCfg(5000);
    if(!cfg){leaveRoom();await say(`[ ${code} ] 방을 찾지 못했어요. 코드를 다시 확인해 주세요.`);return multiMenu()}
    startMulti({code,seed:cfg.seed,diff:cfg.diff,days:cfg.days,dayMs:cfg.dayMs,startAt:cfg.startAt,host:false,name});
    pushPresence();
    await say(cfg.startAt?`[ ${code} ] 방에 참가했어요. 이미 게임이 진행 중이라 지금 날짜부터 함께해요!`:`[ ${code} ] 방에 참가했어요. (${cfg.days}일 · 하루 ${Math.round((cfg.dayMs||180000)/60000)}분)\n방장이 시작할 때까지 마을을 둘러보세요. 시장은 아직 열리지 않아요.`,'멀티');
  }
}
async function continueMulti(sv){
  S=sv;placePlayer(S.player||{x:4,y:5,dir:'down'});resetNPCs();updatePrices();mode='play';updateHUD();
  try{await connectRoom(S.multi.code);pushPresence();toast(`[ ${S.multi.code} ] 방에 다시 들어왔어요`)}
  catch(e){toast('서버에 연결하지 못했어요. 혼자서 계속 진행돼요.')}
}
function timeForElapsed(el){
  const ms=dayMsOf(),u=ms/12/1000,SEG=SEG_W.map(w=>w*u),r=(el%ms)/1000;
  if(r<SEG[0])return DAY_START+(OPEN-DAY_START)*r/SEG[0];
  if(r<SEG[0]+SEG[1])return OPEN+(CLOSE-OPEN)*(r-SEG[0])/SEG[1];
  return Math.min(NIGHT_END,CLOSE+(NIGHT_END-CLOSE)*(r-SEG[0]-SEG[1])/SEG[2]);
}
function multiTick(){
  const M=S.multi;
  if(performance.now()-lastConnCheck>3000){lastConnCheck=performance.now();ensureConn()}
  if(mode!=='play'||!M.startAt)return;
  const el=Date.now()-M.startAt;
  if(el<0){const sec=Math.ceil(-el/1000);if(sec!==M.cd){M.cd=sec;if(sec<=5)toast(`시작까지 ${sec}초`)}return}
  const day=Math.floor(el/dayMsOf())+1;
  while(S.day<day&&mode==='play')multiDayEnd();
  if(mode!=='play'||S.day>M.days)return;
  const t=timeForElapsed(el);if(t>S.time)clockTo(t);
  if(performance.now()-lastPresence>4000)pushPresence();
}
function pruneOthers(){for(const id in OTHERS){const o=OTHERS[id];if(o.gone&&Date.now()-o.gone>8000){toast(`${o.name} 님이 나갔어요`);delete OTHERS[id]}}}
function multiDayEnd(){
  const prev=S.eqHist[S.eqHist.length-1],rep=advanceDay();resetNPCs();
  const eq=equity(),d=eq-prev,[me,n]=myRank();
  toast(`${rep.day}일차 장 마감 · 총자산 ${fmt(eq)} (${d>=0?'+':''}${fmt(d)}) · 방 순위 ${me}/${n}`,'news');
  pushPresence();save();
  if(S.day>S.multi.days)return ending('multi');
  if(inBk()&&S.bk.strikes>=strikeMax())return ending('fail');
  if(!inBk()&&equity()<0){if(S.bkCount>=1)return ending('bankrupt');run(declareBankruptcy)}
}
async function sendChat(){
  const opts=['직접 입력','가즈아!','물렸다...','떡상 가즈아~','ㅋㅋㅋㅋ','안녕하세요!','취소'];
  const c=await choose('뭐라고 말할까요?',opts);
  let text=null;
  if(c===0)text=await ask('할 말을 입력하세요. (최대 30글자)','',30);
  else if(c<opts.length-1)text=opts[c];
  if(!text||!chan)return;
  chan.send({type:'broadcast',event:'chat',payload:{id:myId(),name:S.multi.name,text}});
  myBubble={text,t:5};
}
function hostStart(){
  const M=S.multi;if(!M.host||M.startAt)return;
  M.startAt=Date.now()+6000;pushPresence();
  if(chan)chan.send({type:'broadcast',event:'start',payload:{startAt:M.startAt}});
  toast('6초 뒤 게임이 시작돼요!','news');save();
}
function sendMove(){
  if(!S||!S.multi||!chan||!P.moving)return;
  if(lastMv&&lastMv.tx===P.tx&&lastMv.ty===P.ty)return;
  lastMv={tx:P.tx,ty:P.ty};
  chan.send({type:'broadcast',event:'mv',payload:{id:myId(),x:P.x,y:P.y,tx:P.tx,ty:P.ty,dir:P.dir}});
}
function drawBubble(text,cx,cy){
  ctx.font=`18px ${FONT}`;
  const w=Math.min(ctx.measureText(text).width+20,420),h=30;
  ctx.fillStyle='#1d1d24';ctx.fillRect(cx-w/2-3,cy-h-3,w+6,h+6);
  ctx.fillStyle='#ffffff';ctx.fillRect(cx-w/2,cy-h,w,h);ctx.fillRect(cx-4,cy,8,6);
  ctx.fillStyle='#1d1d24';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,cx,cy-h/2+1,400);
}
function nameTag(text,cx,cy,col){
  ctx.font=`16px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(text).width+10;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(cx-w/2,cy-10,w,20);
  ctx.fillStyle=col;ctx.fillText(text,cx,cy+1);
}

/* ================= 루프 ================= */
function timeRunning(){return mode==='play'&&!sleeping&&(!stack.length||topType()==='trade')}
function tickTime(dt){
  if(S.multi){multiTick();return}
  if(!timeRunning()||S.time>=NIGHT_END)return;
  const a=S.time,rate=a<OPEN?3:a<CLOSE?2.6:8;
  clockTo(Math.min(NIGHT_END,a+dt*rate));
}
// 시간을 b까지 진행시키며 그 사이 일어날 일(개장, 속보, 사건, 마감)을 처리한다
function clockTo(b){
  const a=S.time;if(b<a)return;b=Math.min(NIGHT_END,b);S.time=b;
  if(a<OPEN&&b>=OPEN){toast('딩동! 장이 열렸습니다 (09:00)','news');bell()}
  for(const e of S.events){
    if(!e.fired&&b>=OPEN+(e.step+DF().lag)*STEP){
      e.fired=true;toast(`[속보] ${e.text}`,'news');newsBeep();
      if(e.up&&e.id&&S.pos[e.id])ach('news');
    }
  }
  if(a<720&&b>=720){
    if(wdOf(S.day)===0&&NPCS.some(n=>n.id==='daisy'&&!n.talking)){NPCS=NPCS.filter(n=>n.id!=='daisy');toast('정오가 되자 무순이가 떠났다')}
    else if(turnipPrice())toast(`미믹 매입상자: 오후 황금무 시세 ${fmt(turnipPrice())}원`);
  }
  if(S.street&&!S.street.done&&b>=S.street.at){
    S.street.done=true;
    if(S.street.type==='pick'){
      const loss=Math.min(Math.round(Math.max(0,S.cash)*.05),300000);
      if(loss>0){S.cash-=loss;buzz();ach('pick');toast(`어두운 골목에서 소매치기를 당했다! ${fmt(loss)}원을 잃었다`,'news')}
    }else{const gain=pick([10000,20000,50000,100000]);S.cash+=gain;coin();toast(`길에서 지갑을 주웠다... 주인이 없어 ${fmt(gain)}원 획득`,'news')}
    updateHUD();
  }
  if(a<CLOSE&&b>=CLOSE){toast('장 마감! 오늘 종가가 확정되었습니다','news');bell();save()}
  if(a<NIGHT_END&&b>=NIGHT_END)toast('밤이 깊었다. 집에 가서 자자.');
  updatePrices();
  if(Math.floor(a/10)!==Math.floor(b/10))updateHUD();
}
function step(o,dt,speed){o.t+=dt*speed;if(o.t>=1){o.x=o.tx;o.y=o.ty;o.t=0;o.moving=false}}
let clock=0;
function update(dt){
  clock+=dt;
  if(S)tickTime(dt);
  if(topType()==='trade'){tradeAcc+=dt;if(tradeAcc>.35){tradeAcc=0;refreshTrade()}}
  if(D.active&&D.i<D.text.length){
    D.acc+=dt*48;
    while(D.acc>=1&&D.i<D.text.length){D.i++;D.acc--;if(D.i%3===0&&D.text[D.i-1].trim())tone(880,.02,'square',.015)}
    D.txt.textContent=D.text.slice(0,D.i);
    if(D.i>=D.text.length)D.more.hidden=false;
  }
  if(P.moving)step(P,dt,5.5);
  if(route&&(held.length||!canControl()))route=null;
  if(route&&!P.moving){
    if(!route.path.length){
      const f=route.face;route=null;
      if(f){const dx=f[0]-P.x,dy=f[1]-P.y;P.dir=dx>0?'right':dx<0?'left':dy>0?'down':'up';if(interactable(f[0],f[1])||tileAt(f[0],f[1])==='~'||lampAt(f[0],f[1]))interact()}
    }else{
      const [nx,ny]=route.path[0],dx=nx-P.x,dy=ny-P.y;
      P.dir=dx>0?'right':dx<0?'left':dy>0?'down':'up';
      if(blocked(nx,ny,P)){const d=route.dest;route=null;planRoute(d[0],d[1])}
      else{route.path.shift();P.tx=nx;P.ty=ny;P.moving=true;P.t=0}
    }
  }
  if(!P.moving&&canControl()&&held.length){
    const d=held[held.length-1];P.dir=d;
    const [dx,dy]=DV[d];
    if(!blocked(P.x+dx,P.y+dy,P)){P.tx=P.x+dx;P.ty=P.y+dy;P.moving=true;P.t=0}
  }
  sendMove();if(chan)pruneOthers();
  for(const id in OTHERS){const o=OTHERS[id];if(o.moving)step(o,dt,5.5);if(o.bubbleT>0)o.bubbleT-=dt}
  if(myBubble&&(myBubble.t-=dt)<=0)myBubble=null;
  for(const n of NPCS){
    if(n.moving){step(n,dt,3);continue}
    if(!n.wander||n.talking)continue;
    n.timer-=dt;
    if(n.timer<=0){
      n.timer=1+rand()*2.5;
      const d=pick(['up','down','left','right']),[dx,dy]=DV[d];
      n.dir=d;if(dx)n.face=dx>0?'right':'left';
      const nx=n.x+dx,ny=n.y+dy;
      if(Math.abs(nx-n.ox)<=n.wander&&Math.abs(ny-n.oy)<=n.wander&&!blocked(nx,ny,n)){n.tx=nx;n.ty=ny;n.moving=true;n.t=0}
    }
  }
}
const lerp=o=>[(o.x+(o.tx-o.x)*o.t)*T,(o.y+(o.ty-o.y)*o.t)*T];
function plate(text,cx,cy,size,fg,bgc,edge){
  ctx.font=`${size}px ${FONT}`;
  const w=ctx.measureText(text).width+size*.9,h=size*1.45;
  ctx.fillStyle=edge;ctx.fillRect(cx-w/2-3,cy-h/2-3,w+6,h+6);
  ctx.fillStyle=bgc;ctx.fillRect(cx-w/2,cy-h/2,w,h);
  ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,cx,cy+1);
}
const DROPS=Array.from({length:110},()=>({x:rand(),y:rand(),s:.6+rand()*.6}));
function nightAmt(){const t=S?S.time:600;return t<1020?0:t<1140?(t-1020)/120*.35:Math.min(.6,.35+(t-1140)/120*.25)}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
  ctx.drawImage(bg,0,0,cv.width,cv.height);
  ctx.setTransform(SC,0,0,SC,0,0);
  for(const [x,y] of WATER){
    const ph=Math.round(Math.sin(clock*2+x*1.3+y*.7)*2);
    R(x*T+4+ph,y*T+5,4,1,'#7cb6f2');R(x*T+9-ph,y*T+11,3,1,'#7cb6f2');
  }
  const rainy=S&&S.weather==='rain',list=[];
  for(const n of NPCS){
    const [px,py]=lerp(n),fr=n.moving?(Math.floor(clock*8)%2?1:2):0;
    list.push({y:py,f:()=>{
      if(n.cat)drawCat(px,py,n.face,fr,clock);
      else if(n.mimic)drawMimic(px,py,clock+n.x);
      else{
        if(n.rod){const s=Math.round(Math.sin(clock*1.5));R(px-5,py+5,8,1,'#8b5a2b');R(px-5,py+6,1,5+s,'#e8e8e8');R(px-6,py+11+s,3,1,'#ff5050')}
        drawChar(px,py,n.dir,fr,n.col,{ant:n.ant,tie:n.tie,bag:n.bag,ears:n.ears,fin:n.fin,shades:n.shades,turnip:n.turnip,umbrella:rainy&&!n.rod&&!n.bag&&!n.turnip});
      }
    }});
  }
  for(const id in OTHERS){const o=OTHERS[id],[px,py]=lerp(o),fr=o.moving?(Math.floor(clock*8)%2?1:2):0;
    list.push({y:py,f:()=>drawChar(px,py,o.dir,fr,{skin:'#f6cda6',hair:'#3a2a1a',shirt:o.col||'#888',pants:'#2a2a40'},{cap:true})})}
  {const [px,py]=lerp(P),fr=P.moving?(Math.floor(clock*8)%2?1:2):0;
   list.push({y:py,f:()=>drawChar(px,py,P.dir,fr,P.col,{cap:true})});}
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  if(route){const [x,y]=route.dest,a=Math.sin(clock*8)>0;R(x*T+1,y*T+1,14,1,a?'#ffd451':'#fff');R(x*T+1,y*T+14,14,1,a?'#ffd451':'#fff');R(x*T+1,y*T+1,1,14,a?'#ffd451':'#fff');R(x*T+14,y*T+1,1,14,a?'#ffd451':'#fff')}
  if(canControl()&&!P.moving){
    const [x,y]=targetOf();
    if(interactable(x,y)){
      const by=y*T-9+Math.round(Math.sin(clock*5));
      R(x*T+4,by,8,8,'#1d1d24');R(x*T+5,by+1,6,6,'#ffffff');R(x*T+7,by+2,2,3,'#e33b3b');R(x*T+7,by+6,2,1,'#e33b3b');
    }
  }
  ctx.setTransform(1,0,0,1,0,0);
  const W=cv.width,H=cv.height;
  if(S&&S.weather==='rain'){
    ctx.fillStyle='rgba(40,60,110,.18)';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(200,220,255,.55)';ctx.lineWidth=2;ctx.beginPath();
    for(const d of DROPS){const x=(d.x*W+clock*120*d.s)%W,y=(d.y*H+clock*700*d.s)%H;ctx.moveTo(x,y);ctx.lineTo(x-5,y+18)}
    ctx.stroke();
  }else if(S&&S.weather==='snow'){
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(const d of DROPS){const x=(d.x*W+Math.sin(clock+d.y*10)*30+W)%W,y=(d.y*H+clock*60*d.s)%H;ctx.fillRect(x,y,5*d.s,5*d.s)}
  }
  const na=nightAmt();
  if(na>0){
    const dusk=na<.35?na*.35:Math.max(0,.12-(na-.35)*.5);
    if(dusk>0){ctx.fillStyle=`rgba(255,110,40,${dusk})`;ctx.fillRect(0,0,W,H)}
    ctx.fillStyle=`rgba(10,14,60,${na})`;ctx.fillRect(0,0,W,H);
    const glow=Math.min(1,na/.4);
    ctx.globalCompositeOperation='lighter';
    for(const [x,y] of LAMPS){
      const cx=(x*T+8)*SC,cy=(y*T+3)*SC,gr=ctx.createRadialGradient(cx,cy,0,cx,cy,90);
      gr.addColorStop(0,`rgba(255,220,140,${.55*glow})`);gr.addColorStop(1,'rgba(255,220,140,0)');
      ctx.fillStyle=gr;ctx.fillRect(cx-90,cy-90,180,180);
    }
    ctx.fillStyle=`rgba(255,210,110,${.7*glow})`;
    for(const [x,y,w,h] of WINDOWS)ctx.fillRect(x*SC,y*SC,w*SC,h*SC);
    ctx.globalCompositeOperation='source-over';
  }
  ctx.font=`bold 24px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#000';ctx.fillText('모험가 증권거래소',(128+40)*SC+2,21*SC+2);
  ctx.fillStyle=COL.gold;ctx.fillText('모험가 증권거래소',(128+40)*SC,21*SC);
  if(S){
    const x0=(128+3)*SC,x1=(208-3)*SC,yc=(16+17)*SC;
    ctx.save();ctx.beginPath();ctx.rect(x0,(16+12)*SC,x1-x0,10*SC);ctx.clip();
    ctx.font=`22px ${FONT}`;ctx.textAlign='left';
    const segs=[{t:`${hhmm(S.time)} ${phase()[0]}   `,c:COL.gold},...S.stocks.map(s=>{const c=chgOf(s);return {t:s.dead?`${INFO[s.id].name} 상장폐지   `:`${INFO[s.id].name} ${fmt(s.price)} ${arrow(c)}${(Math.abs(c)*100).toFixed(1)}%   `,c:c>1e-6?COL.up:c<-1e-6?COL.dn:'#e8e8e8'}})];
    const widths=segs.map(s=>ctx.measureText(s.t).width),total=widths.reduce((a,b)=>a+b,0);
    let x=x0-((clock*70)%total);
    while(x<x1){segs.forEach((s,i)=>{if(x<x1&&x+widths[i]>x0){ctx.fillStyle=s.c;ctx.fillText(s.t,x,yc)}x+=widths[i]})}
    ctx.restore();
  }
  plate('집',(32+40)*SC,(32+25)*SC,20,'#3a2414','#e9c88f','#5e3920');
  if(S&&S.multi){
    for(const id in OTHERS){const o=OTHERS[id],[px,py]=lerp(o),cx=(px+8)*SC;nameTag(o.name||'?',cx,(py-5)*SC,'#ffffff');if(o.bubbleT>0)drawBubble(o.bubble,cx,(py-11)*SC)}
    const [px,py]=lerp(P),cx=(px+8)*SC;nameTag(S.multi.name,cx,(py-5)*SC,COL.gold);if(myBubble)drawBubble(myBubble.text,cx,(py-11)*SC);
  }
  plate('은행',(240+24)*SC,(32+10)*SC,18,COL.gold,'#2e5a42','#1d3a2a');
  plate('점집',(224+24)*SC,(144+29)*SC,18,'#fff2c4','#3b1f63','#1a0c30');
}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}

/* ================= 부팅 ================= */
function boot(data){
  S=newState();rollDay();resetNPCs();
  if(data&&data.S&&data.S.v===3&&data.mode==='play')continueGame(data.S);
  else showTitle();
  requestAnimationFrame(loop);
}
try{window.claude?.hot?.snapshot?.(()=>({S,mode}))}catch(e){}
try{window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{})}catch(e){boot({})}
})();
</script>
